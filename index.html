/**
 * 05_Script.gs — Script Studio: versi naskah, validasi, persetujuan, diff, AI (Gemini)
 */

var FRAMINGS = ['EXTREME_WIDE', 'WIDE', 'MEDIUM', 'MEDIUM_CLOSE_UP', 'CLOSE_UP', 'EXTREME_CLOSE_UP', 'POV', 'OVER_SHOULDER', 'INSERT'];

function latestScript_(epId) {
  var list = Db.all('Scripts', function (s) { return s.episodeId === epId; });
  if (!list.length) return null;
  return list.sort(function (a, b) { return b.version - a.version; })[0];
}

function scriptVersions_(epId) {
  return Db.all('Scripts', function (s) { return s.episodeId === epId; })
    .map(function (s) { return { version: s.version, createdAt: s.createdAt, approved: s.approved, source: s.source, validation: s.validation, totalSec: s.totalSec }; })
    .sort(function (a, b) { return b.version - a.version; });
}

/** Normalisasi + validasi naskah. Mengembalikan {scenes,total,status,issues} */
function validateScript_(scenes, hook, ep, characters) {
  var issues = [], invalid = false, names = {};
  (characters || []).forEach(function (c) { names[String(c.name).toLowerCase()] = true; });
  scenes = (Array.isArray(scenes) ? scenes : []).slice(0, 60).map(function (sc, i) {
    var shots = (sc.shots || []).slice(0, 40).map(function (sh, j) {
      return { id: sh.id || uid_('sh'), shotNumber: j + 1, framing: FRAMINGS.indexOf(sh.framing) >= 0 ? sh.framing : 'MEDIUM',
        visualDirection: clean_(sh.visualDirection, 1500), lightingAudio: clean_(sh.lightingAudio, 500), durationSeconds: Math.max(1, Math.min(60, toNum_(sh.durationSeconds, 3))) };
    });
    var dlg = (sc.dialogues || []).slice(0, 80).map(function (d) {
      return { id: d.id || uid_('dl'), speaker: clean_(d.speaker, 60), emotion: clean_(d.emotion, 60), line: clean_(d.line, 600), pacingSeconds: Math.max(1, Math.min(30, toNum_(d.pacingSeconds, 3))) };
    });
    var shotSec = shots.reduce(function (s, x) { return s + x.durationSeconds; }, 0);
    var dlgSec = dlg.reduce(function (s, x) { return s + x.pacingSeconds; }, 0);
    var est = Math.max(shotSec, dlgSec);
    var label = 'Adegan ' + (i + 1);
    if (!clean_(sc.setting)) { issues.push(label + ': setting/lokasi kosong.'); }
    if (!shots.length) { issues.push(label + ': belum ada shot.'); invalid = true; }
    dlg.forEach(function (d, k) {
      if (!d.line) issues.push(label + ' dialog ' + (k + 1) + ': kalimat kosong.');
      if (d.speaker && characters && characters.length && !names[d.speaker.toLowerCase()] && !/^(narator|narrator|vo|v\.o\.|suara)/i.test(d.speaker))
        issues.push(label + ': pembicara "' + d.speaker + '" tidak ada di Character Bible.');
      if (d.line.length > 0 && d.line.length / d.pacingSeconds > 17) issues.push(label + ' dialog ' + (k + 1) + ': terlalu cepat dibaca (' + Math.round(d.line.length / d.pacingSeconds) + ' karakter/detik, maks 17).');
    });
    return { id: sc.id || uid_('sc'), sceneNumber: i + 1, setting: clean_(sc.setting, 200), charactersPresent: (sc.charactersPresent || []).map(function (n) { return clean_(n, 60); }).filter(String).slice(0, 12),
      summary: clean_(sc.summary, 1500), shots: shots, dialogues: dlg, estimatedSeconds: est };
  });
  if (!scenes.length) { issues.push('Naskah belum memiliki adegan.'); invalid = true; }
  var total = scenes.reduce(function (s, x) { return s + x.estimatedSeconds; }, 0);
  var maxSec = getSetting_('qc').maxDurationSec;
  if (total > maxSec) { issues.push('Durasi ' + total + ' dtk melebihi batas maksimal ' + maxSec + ' dtk.'); invalid = true; }
  else if (ep && ep.durationSec && total > ep.durationSec * 1.2) issues.push('Durasi ' + total + ' dtk melebihi target ' + ep.durationSec + ' dtk (>20%).');
  if (!clean_(hook)) issues.push('Cliffhanger/hook penutup belum diisi.');
  return { scenes: scenes, total: total, status: invalid ? 'INVALID' : (issues.length ? 'WARNING' : 'VALID'), issues: issues };
}

function saveScriptVersion_(ctx, epId, d, source) {
  var ep = Db.get('Episodes', epId);
  var chars = Db.all('Characters', function (c) { return c.seriesId === ep.seriesId; });
  var v = validateScript_(d.scenes, d.hook, ep, chars);
  var prev = latestScript_(epId);
  var rec = { id: uid_('scr'), orgId: ep.orgId, episodeId: epId, version: prev ? prev.version + 1 : 1, title: clean_(d.title, 160) || ep.title,
    scenes: v.scenes, hook: clean_(d.hook, 600), totalSec: v.total, validation: v.status, issues: v.issues, approved: false, approvedBy: '', approvedAt: '',
    source: source || 'MANUAL', createdBy: ctx.email, createdAt: nowIso_() };
  Db.insert('Scripts', rec);
  var patch = { durationSec: v.total || ep.durationSec, updatedAt: nowIso_() };
  if (rec.hook) patch.hook = rec.hook;
  if (ep.status === 'DRAFT') patch.status = 'SCRIPT_IN_PROGRESS';
  Db.update('Episodes', epId, patch);
  return rec;
}

function scriptGet_(ctx, d) {
  studioOnly_(ctx);
  ownEpisode_(ctx, d.episodeId);
  var list = Db.all('Scripts', function (s) { return s.episodeId === d.episodeId; });
  var sc = d.version ? list.filter(function (s) { return s.version === toNum_(d.version); })[0] : latestScript_(d.episodeId);
  return { script: sc || null, versions: scriptVersions_(d.episodeId) };
}

function scriptSave_(ctx, d) {
  requireRole_(ctx, ['ADMIN', 'CREATOR']);
  var ep = ownEpisode_(ctx, d.episodeId);
  assert_(['DRAFT', 'SCRIPT_IN_PROGRESS', 'STORYBOARD_READY'].indexOf(ep.status) >= 0, 'LOCKED', 'Naskah terkunci pada status ' + STATUS_LABEL[ep.status] + '. Kembalikan ke Penulisan Naskah dulu.');
  var rec = saveScriptVersion_(ctx, ep.id, d, d.source === 'AI' ? 'AI_EDITED' : 'MANUAL');
  if (ep.status === 'STORYBOARD_READY') Db.update('Episodes', ep.id, { status: 'SCRIPT_IN_PROGRESS' });
  audit_(ctx, 'SCRIPT_SAVE', 'script', rec.id, { episodeId: ep.id, version: rec.version, validation: rec.validation });
  return rec;
}

function scriptApprove_(ctx, d) {
  requireRole_(ctx, ['ADMIN', 'REVIEWER']);
  var ep = ownEpisode_(ctx, d.episodeId);
  assert_(ep.status === 'SCRIPT_REVIEW', 'BAD_STATE', 'Episode belum diajukan untuk review naskah.');
  var sc = latestScript_(ep.id);
  assert_(sc && sc.validation !== 'INVALID', 'INVALID_SCRIPT', 'Naskah tidak valid.');
  if (d.decision === 'REJECT') {
    Db.update('Episodes', ep.id, { status: 'SCRIPT_IN_PROGRESS', updatedAt: nowIso_() });
    if (clean_(d.notes)) Db.insert('Comments', { id: uid_('cmt'), orgId: ctx.orgId, episodeId: ep.id, userId: ctx.userId, userName: ctx.name, role: ctx.role, tsSec: 0, frameId: '', text: '[Revisi naskah v' + sc.version + '] ' + clean_(d.notes, 2000), resolved: false, createdAt: nowIso_() });
    audit_(ctx, 'SCRIPT_REJECT', 'script', sc.id, { version: sc.version, notes: clean_(d.notes, 300) });
    return { ok: true, status: 'SCRIPT_IN_PROGRESS' };
  }
  Db.update('Scripts', sc.id, { approved: true, approvedBy: ctx.email, approvedAt: nowIso_() });
  Db.update('Episodes', ep.id, { status: 'STORYBOARD_READY', updatedAt: nowIso_() });
  audit_(ctx, 'SCRIPT_APPROVE', 'script', sc.id, { version: sc.version });
  return { ok: true, status: 'STORYBOARD_READY' };
}

/** Bandingkan dua versi naskah (diff nyata, bukan data contoh) */
function scriptDiff_(ctx, d) {
  studioOnly_(ctx);
  ownEpisode_(ctx, d.episodeId);
  var list = Db.all('Scripts', function (s) { return s.episodeId === d.episodeId; });
  var a = list.filter(function (s) { return s.version === toNum_(d.base); })[0], b = list.filter(function (s) { return s.version === toNum_(d.target); })[0];
  assert_(a && b, 'NOT_FOUND', 'Versi tidak ditemukan.');
  var changes = [];
  if (a.hook !== b.hook) changes.push({ type: 'MODIFIED', entity: 'HOOK', description: 'Cliffhanger diubah', before: a.hook, after: b.hook });
  var max = Math.max(a.scenes.length, b.scenes.length);
  for (var i = 0; i < max; i++) {
    var x = a.scenes[i], y = b.scenes[i], lbl = 'Adegan ' + (i + 1);
    if (!x) { changes.push({ type: 'ADDED', entity: 'SCENE', description: lbl + ' ditambahkan', after: y.setting }); continue; }
    if (!y) { changes.push({ type: 'REMOVED', entity: 'SCENE', description: lbl + ' dihapus', before: x.setting }); continue; }
    if (x.setting !== y.setting || x.summary !== y.summary) changes.push({ type: 'MODIFIED', entity: 'SCENE', description: lbl + ' setting/ringkasan', before: x.setting + ' — ' + x.summary, after: y.setting + ' — ' + y.summary });
    if (x.shots.length !== y.shots.length) changes.push({ type: 'MODIFIED', entity: 'SHOT', description: lbl + ': jumlah shot ' + x.shots.length + ' → ' + y.shots.length });
    var dm = Math.max(x.dialogues.length, y.dialogues.length);
    for (var k = 0; k < dm; k++) {
      var p = x.dialogues[k], q = y.dialogues[k];
      if (!p) changes.push({ type: 'ADDED', entity: 'DIALOGUE', description: lbl + ' dialog baru', after: q.speaker + ': ' + q.line });
      else if (!q) changes.push({ type: 'REMOVED', entity: 'DIALOGUE', description: lbl + ' dialog dihapus', before: p.speaker + ': ' + p.line });
      else if (p.line !== q.line || p.speaker !== q.speaker) changes.push({ type: 'MODIFIED', entity: 'DIALOGUE', description: lbl + ' dialog ' + (k + 1), before: p.speaker + ': ' + p.line, after: q.speaker + ': ' + q.line });
    }
  }
  return { base: a.version, target: b.version, summary: changes.length + ' perubahan; durasi ' + a.totalSec + ' → ' + b.totalSec + ' dtk', changes: changes };
}

/* ================================ AI ================================ */
var SCRIPT_SCHEMA_HINT = '{"title":string,"hook":string,"scenes":[{"setting":string,"charactersPresent":[string],"summary":string,' +
  '"shots":[{"framing":"WIDE|MEDIUM|CLOSE_UP|EXTREME_CLOSE_UP|POV|OVER_SHOULDER|INSERT","visualDirection":string,"lightingAudio":string,"durationSeconds":number}],' +
  '"dialogues":[{"speaker":string,"emotion":string,"line":string,"pacingSeconds":number}]}]}';

function scriptAiGenerate_(ctx, d) {
  requireRole_(ctx, ['ADMIN', 'CREATOR']);
  var ep = ownEpisode_(ctx, d.episodeId), s = Db.get('Series', ep.seriesId);
  assert_(['DRAFT', 'SCRIPT_IN_PROGRESS'].indexOf(ep.status) >= 0, 'LOCKED', 'Naskah hanya bisa dibuat pada status Draf / Penulisan Naskah.');
  var chars = Db.all('Characters', function (c) { return c.seriesId === s.id; });
  var prev = Db.all('Episodes', function (e) { return e.seriesId === s.id && e.number < ep.number; }).sort(function (a, b) { return b.number - a.number; }).slice(0, 3);
  var prompt = [
    'Anda penulis skenario drama vertikal 9:16 berdurasi pendek. Tulis naskah ORISINAL (dilarang meniru IP, judul, atau tokoh milik pihak lain, dilarang memakai nama tokoh publik nyata).',
    'Bahasa: ' + (d.language || s.language || 'id') + '. Target durasi: ' + (ep.durationSec || s.targetSec) + ' detik. 3–5 adegan, pembuka kuat 3 detik pertama, akhiri dengan cliffhanger.',
    'Serial: ' + s.title + ' | Genre: ' + s.genre + ' | Logline: ' + s.logline,
    'Sinopsis: ' + String(s.synopsis).slice(0, 2500),
    'Karakter (gunakan HANYA nama ini sebagai speaker): ' + chars.map(function (c) { return c.name + ' (' + c.archetype + '; ' + c.personality + ')'; }).join('; '),
    'Episode ' + ep.number + ': ' + ep.title + (ep.hook ? ' | Hook yang diinginkan: ' + ep.hook : ''),
    prev.length ? 'Episode sebelumnya: ' + prev.map(function (e) { return 'Ep' + e.number + ' ' + e.title + ' (hook: ' + e.hook + ')'; }).join(' | ') : '',
    d.instructions ? 'Arahan tambahan: ' + clean_(d.instructions, 1500) : '',
    'Kalimat dialog maksimal 90 karakter agar terbaca di layar ponsel. Keluarkan JSON SAJA sesuai skema: ' + SCRIPT_SCHEMA_HINT
  ].filter(String).join('\n');
  var out = Ai.generateJson(ctx, 'SCRIPT_GEN', prompt, ep.id);
  var rec = saveScriptVersion_(ctx, ep.id, { title: out.title || ep.title, scenes: out.scenes || [], hook: out.hook || ep.hook }, 'AI');
  audit_(ctx, 'SCRIPT_AI_GENERATE', 'script', rec.id, { version: rec.version, validation: rec.validation });
  return rec;
}

function scriptAiDoctor_(ctx, d) {
  studioOnly_(ctx);
  var ep = ownEpisode_(ctx, d.episodeId), sc = latestScript_(ep.id);
  assert_(sc, 'NO_SCRIPT', 'Belum ada naskah untuk dianalisis.');
  var prompt = 'Anda script doctor drama vertikal. Analisis naskah berikut dan beri skor 0-100 untuk: hook3detik, pacing, konflik, cliffhanger, konsistensiKarakter, kejelasanDialog. ' +
    'Beri maksimal 6 saran konkret berbahasa Indonesia. Keluarkan JSON: {"scores":{...},"overall":number,"suggestions":[string],"riskFlags":[string]} ' +
    '(riskFlags: potensi pelanggaran hak cipta/merek, tokoh nyata, konten SARA/sensitif).\nNASKAH:\n' + JSON.stringify({ hook: sc.hook, scenes: sc.scenes }).slice(0, 30000);
  return Ai.generateJson(ctx, 'SCRIPT_DOCTOR', prompt, ep.id);
}

/**
 * 06_Production.gs — Storyboard, Assembly & Audio (subtitle), QC & Sign-off, Kolaborasi, Bundle
 */

var LICENSE_STATUS = ['SYNTHETIC_CLEAN', 'COMMERCIAL_LICENSED', 'CONSENT_VERIFIED', 'UNVERIFIED'];

/* ============================== STORYBOARD ============================== */
function storyboardList_(ctx, d) {
  studioOnly_(ctx);
  ownEpisode_(ctx, d.episodeId);
  return Db.all('Frames', function (f) { return f.episodeId === d.episodeId; }).sort(function (a, b) { return a.sceneNo - b.sceneNo || a.shotNo - b.shotNo; });
}

function buildFramePrompt_(series, scene, shot, chars) {
  var present = chars.filter(function (c) { return (scene.charactersPresent || []).map(function (n) { return n.toLowerCase(); }).indexOf(String(c.name).toLowerCase()) >= 0; });
  return ['Vertical 9:16 cinematic keyframe, ' + String(shot.framing).replace(/_/g, ' ').toLowerCase() + ' shot.',
    'Location: ' + scene.setting + '.', 'Action: ' + shot.visualDirection + '.',
    present.length ? 'Characters (original, fictional — do not resemble real people): ' + present.map(function (c) { return c.name + ': ' + c.visual + '; wardrobe ' + c.wardrobe; }).join(' | ') + '.' : '',
    'Mood/lighting: ' + (shot.lightingAudio || 'dramatic') + '. Genre ' + series.genre + '. Keep subject inside central safe area; no text, no logos, no watermarks.'
  ].filter(String).join(' ');
}

function storyboardGenerate_(ctx, d) {
  requireRole_(ctx, ['ADMIN', 'CREATOR']);
  var ep = ownEpisode_(ctx, d.episodeId), s = Db.get('Series', ep.seriesId), sc = latestScript_(ep.id);
  assert_(sc && sc.approved, 'SCRIPT_NOT_APPROVED', 'Storyboard hanya bisa dibuat dari naskah yang sudah disetujui reviewer.');
  assert_(ep.status === 'STORYBOARD_READY', 'BAD_STATE', 'Episode harus berstatus Storyboard.');
  var chars = Db.all('Characters', function (c) { return c.seriesId === s.id; });
  var existing = Db.all('Frames', function (f) { return f.episodeId === ep.id; });
  var keep = {};
  existing.forEach(function (f) { keep[f.sceneNo + '-' + f.shotNo] = f; });
  if (d.replace) Db.removeWhere('Frames', function (f) { return f.episodeId === ep.id; });
  var rows = [];
  sc.scenes.forEach(function (scene) {
    scene.shots.forEach(function (shot) {
      if (!d.replace && keep[scene.sceneNumber + '-' + shot.shotNumber]) return;
      var dl = (scene.dialogues || [])[shot.shotNumber - 1];
      var prompt = buildFramePrompt_(s, scene, shot, chars);
      rows.push({ id: uid_('frm'), orgId: ctx.orgId, episodeId: ep.id, sceneNo: scene.sceneNumber, shotNo: shot.shotNumber, framing: shot.framing,
        prompt: prompt, imageUrl: '', location: scene.setting, chars: scene.charactersPresent || [], dialogue: dl ? dl.speaker + ': ' + dl.line : '',
        durationSec: shot.durationSeconds, status: 'GENERATED', notes: '', license: 'SYNTHETIC_CLEAN', provider: 'prompt-only', costUsd: 0,
        checksum: sha256Hex_(prompt).slice(0, 16), version: 1, reviewedBy: '', updatedAt: nowIso_() });
    });
  });
  Db.insertMany('Frames', rows);
  audit_(ctx, 'STORYBOARD_GENERATE', 'episode', ep.id, { frames: rows.length, scriptVersion: sc.version });
  return storyboardList_(ctx, d);
}

function storyboardUpdate_(ctx, d) {
  studioOnly_(ctx);
  var f = Db.get('Frames', d.id);
  assert_(f && f.orgId === ctx.orgId, 'NOT_FOUND', 'Frame tidak ditemukan.');
  var patch = { updatedAt: nowIso_() };
  if (d.status) {
    assert_(['GENERATED', 'APPROVED', 'FLAGGED_FOR_RETAKE', 'REJECTED'].indexOf(d.status) >= 0, 'BAD_STATUS', 'Status frame tidak valid.');
    if (d.status === 'APPROVED' || d.status === 'REJECTED') requireRole_(ctx, ['ADMIN', 'REVIEWER']);
    if (d.status === 'APPROVED') assert_(f.license !== 'UNVERIFIED' || d.license && d.license !== 'UNVERIFIED', 'LICENSE_UNVERIFIED', 'Frame dengan lisensi UNVERIFIED tidak bisa disetujui.');
    patch.status = d.status; patch.reviewedBy = ctx.email;
  }
  if (d.notes !== undefined) patch.notes = clean_(d.notes, 1000);
  if (d.prompt !== undefined) { requireRole_(ctx, ['ADMIN', 'CREATOR']); patch.prompt = clean_(d.prompt, 4000); patch.checksum = sha256Hex_(patch.prompt).slice(0, 16); }
  if (d.imageUrl !== undefined) {
    requireRole_(ctx, ['ADMIN', 'CREATOR']);
    patch.imageUrl = clean_(d.imageUrl, 500); patch.version = f.version + 1; patch.status = 'GENERATED';
    patch.provider = d.provider || 'upload'; patch.checksum = sha256Hex_(patch.imageUrl).slice(0, 16);
  }
  if (d.license) { assert_(LICENSE_STATUS.indexOf(d.license) >= 0, 'BAD_LICENSE', 'Status lisensi tidak valid.'); patch.license = d.license; }
  if (d.aiImage) {
    requireRole_(ctx, ['ADMIN', 'CREATOR']);
    var img = Ai.generateImage(ctx, f.prompt || '', f.episodeId);
    patch.imageUrl = img.url; patch.provider = img.model; patch.costUsd = f.costUsd + img.costUsd; patch.version = f.version + 1;
    patch.status = 'GENERATED'; patch.license = 'SYNTHETIC_CLEAN'; patch.checksum = img.checksum;
  }
  var up = Db.update('Frames', f.id, patch);
  audit_(ctx, 'STORYBOARD_FRAME_UPDATE', 'frame', f.id, { status: patch.status || f.status, image: !!(d.imageUrl || d.aiImage) });
  return up;
}

/* ============================== ASSEMBLY & AUDIO ============================== */
function secToSrt_(s) {
  var ms = Math.round((s % 1) * 1000), t = Math.floor(s), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), x = t % 60;
  function p(n, l) { return ('000' + n).slice(-(l || 2)); }
  return p(h) + ':' + p(m) + ':' + p(x) + ',' + p(ms, 3);
}

function buildAssembly_(ep, sc, chars) {
  var voices = [], subs = [], t = 0, idx = 1;
  var vmap = {}; chars.forEach(function (c) { vmap[c.name.toLowerCase()] = c; });
  (sc ? sc.scenes : []).forEach(function (scene) {
    var cursor = t + 0.5;
    scene.dialogues.forEach(function (dl) {
      var start = Math.round(cursor * 10) / 10, end = Math.round((cursor + dl.pacingSeconds) * 10) / 10;
      var c = vmap[String(dl.speaker).toLowerCase()];
      voices.push({ id: dl.id, speaker: dl.speaker, characterId: c ? c.id : '', line: dl.line, emotion: dl.emotion, voiceProfile: c ? c.voice : '', startSec: start, endSec: end, audioUrl: '', status: 'PENDING' });
      subs.push({ index: idx++, startSec: start, endSec: end, start: secToSrt_(start), end: secToSrt_(end), speaker: dl.speaker, text: dl.line });
      cursor = end + 0.2;
    });
    t += scene.estimatedSeconds;
  });
  return {
    totalSec: t, resolution: '1080x1920', fps: 30, measuredLufs: null, targetLufs: -14,
    voices: voices, subtitles: subs,
    music: [{ id: 'bgm-1', title: 'BGM tema (isi dengan musik berlisensi)', category: 'BGM', mood: 'tegang', startSec: 0, durationSec: t, volumePct: 35, licenseRef: '' }],
    scriptVersion: sc ? sc.version : 0
  };
}

function hookScore_(hook) {
  hook = String(hook || '');
  if (!hook) return 0;
  var s = 40;
  if (hook.length >= 30 && hook.length <= 180) s += 20;
  if (/[?!…]|\.\.\./.test(hook)) s += 10;
  if (/(rahasia|ternyata|mati|hilang|bohong|pewaris|pengkhianat|hamil|cerai|kembali|siapa|secret|dead|truth|betray|identit)/i.test(hook)) s += 20;
  if (/^(tiba-tiba|saat itu|ternyata)/i.test(hook)) s += 5;
  return Math.min(100, s);
}

function qualityGate_(ep, asm) {
  var maxSec = getSetting_('qc').maxDurationSec;
  var longLines = asm.subtitles.filter(function (s) { return s.text.length > 84; }).length;
  var lufsOk = asm.measuredLufs === null || asm.measuredLufs === '' ? null : Math.abs(toNum_(asm.measuredLufs) - asm.targetLufs) <= 2;
  var hs = hookScore_(ep.hook);
  var g = {
    resolution: { passed: asm.resolution === '1080x1920', value: asm.resolution, expected: '1080x1920' },
    duration: { passed: asm.totalSec > 0 && asm.totalSec <= maxSec, value: asm.totalSec, expected: '≤ ' + maxSec + ' dtk' },
    loudness: { passed: lufsOk === true, pending: lufsOk === null, value: asm.measuredLufs, expected: asm.targetLufs + ' ±2 LUFS' },
    safeArea: { passed: longLines === 0, value: longLines + ' baris > 84 karakter', expected: 'maks 2 baris × 42 karakter' },
    hook: { passed: hs >= getSetting_('qc').minHookScore, value: hs, expected: '≥ ' + getSetting_('qc').minHookScore }
  };
  g.overall = Object.keys(g).every(function (k) { return g[k].passed; }) ? 'COMPLIANT' : 'NEEDS_REVISION';
  return g;
}

function assemblyGet_(ctx, d) {
  studioOnly_(ctx);
  var ep = ownEpisode_(ctx, d.episodeId), row = Db.get('Assembly', ep.id);
  var sc = latestScript_(ep.id);
  var chars = Db.all('Characters', function (c) { return c.seriesId === ep.seriesId; });
  var data = row && row.data ? row.data : null;
  var stale = !data || (sc && data.scriptVersion !== sc.version);
  if (!data || d.rebuild) {
    data = buildAssembly_(ep, sc, chars);
    if (row && row.data && !d.rebuild) { data.music = row.data.music; data.measuredLufs = row.data.measuredLufs; }
    Db.upsert('Assembly', ep.id, { orgId: ctx.orgId, data: data, gate: qualityGate_(ep, data), updatedAt: nowIso_() });
    stale = false;
  }
  return { assembly: data, gate: qualityGate_(ep, data), stale: stale, srt: toSrt_(data.subtitles), vtt: toVtt_(data.subtitles), characters: chars };
}

function assemblySave_(ctx, d) {
  requireRole_(ctx, ['ADMIN', 'CREATOR']);
  var ep = ownEpisode_(ctx, d.episodeId), row = Db.get('Assembly', ep.id);
  assert_(row && row.data, 'NOT_FOUND', 'Buka Assembly terlebih dahulu.');
  var data = row.data;
  if (Array.isArray(d.subtitles)) data.subtitles = d.subtitles.slice(0, 500).map(function (s, i) {
    var st = Math.max(0, toNum_(s.startSec)), en = Math.max(st + 0.3, toNum_(s.endSec));
    return { index: i + 1, startSec: st, endSec: en, start: secToSrt_(st), end: secToSrt_(en), speaker: clean_(s.speaker, 60), text: clean_(s.text, 300) };
  });
  if (Array.isArray(d.music)) data.music = d.music.slice(0, 30).map(function (m, i) {
    return { id: m.id || 'trk-' + i, title: clean_(m.title, 120), category: m.category === 'SFX' ? 'SFX' : 'BGM', mood: clean_(m.mood, 40), startSec: toNum_(m.startSec), durationSec: toNum_(m.durationSec), volumePct: Math.max(0, Math.min(100, toNum_(m.volumePct, 50))), licenseRef: clean_(m.licenseRef, 200) };
  });
  if (Array.isArray(d.voices)) {
    var map = {}; d.voices.forEach(function (v) { map[v.id] = v; });
    data.voices.forEach(function (v) { if (map[v.id]) { v.audioUrl = clean_(map[v.id].audioUrl, 500); v.status = v.audioUrl ? 'READY' : 'PENDING'; } });
  }
  if (d.measuredLufs !== undefined) data.measuredLufs = d.measuredLufs === '' || d.measuredLufs === null ? null : toNum_(d.measuredLufs);
  if (d.resolution) data.resolution = clean_(d.resolution, 20);
  var gate = qualityGate_(ep, data);
  Db.update('Assembly', ep.id, { data: data, gate: gate, updatedAt: nowIso_() });
  audit_(ctx, 'ASSEMBLY_UPDATE', 'episode', ep.id, { gate: gate.overall });
  return { assembly: data, gate: gate, srt: toSrt_(data.subtitles), vtt: toVtt_(data.subtitles) };
}

function toSrt_(subs) {
  return (subs || []).map(function (s, i) { return (i + 1) + '\n' + secToSrt_(s.startSec) + ' --> ' + secToSrt_(s.endSec) + '\n' + s.text + '\n'; }).join('\n');
}
function toVtt_(subs) { return 'WEBVTT\n\n' + toSrt_(subs).replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g, '$1.$2'); }

/* ================================ QC ================================ */
function qcGet_(ctx, d) {
  studioOnly_(ctx);
  ownEpisode_(ctx, d.episodeId);
  return Db.get('QC', d.episodeId);
}

function qcScan_(ctx, d) {
  requireRole_(ctx, ['ADMIN', 'REVIEWER', 'CREATOR']);
  var ep = ownEpisode_(ctx, d.episodeId), sc = latestScript_(ep.id);
  var frames = Db.all('Frames', function (f) { return f.episodeId === ep.id; });
  var chars = Db.all('Characters', function (c) { return c.seriesId === ep.seriesId; });
  var asmRow = Db.get('Assembly', ep.id), asm = asmRow && asmRow.data;
  var comments = Db.all('Comments', function (c) { return c.episodeId === ep.id && !c.resolved; });
  var checks = [];
  function add(type, title, sev, ok, measured, expected, rec, warn) {
    checks.push({ id: type, checkType: type, title: title, severity: sev, status: ok ? 'PASSED' : (warn ? 'WARNING' : 'FAILED'), measuredValue: String(measured), expectedBenchmark: expected, recommendation: ok ? '' : rec });
  }
  add('SCRIPT_APPROVED', 'Naskah disetujui reviewer', 'CRITICAL', !!(sc && sc.approved), sc ? 'v' + sc.version + (sc.approved ? ' disetujui' : ' belum') : 'tidak ada', 'Disetujui', 'Ajukan & setujui naskah di Script Studio.');
  var notApproved = frames.filter(function (f) { return f.status !== 'APPROVED'; }).length;
  add('STORYBOARD', 'Semua frame storyboard disetujui', 'CRITICAL', frames.length > 0 && !notApproved, frames.length + ' frame, ' + notApproved + ' belum', '100% disetujui', 'Selesaikan review storyboard.');
  var used = {}; (sc ? sc.scenes : []).forEach(function (s) { (s.dialogues || []).forEach(function (dl) { used[String(dl.speaker).toLowerCase()] = 1; }); (s.charactersPresent || []).forEach(function (n) { used[String(n).toLowerCase()] = 1; }); });
  var noConsent = chars.filter(function (c) { return used[c.name.toLowerCase()] && (c.consentType !== 'SYNTHETIC' && !c.consentRef); });
  var badLic = frames.filter(function (f) { return f.license === 'UNVERIFIED'; }).length;
  var musicNoLic = asm ? asm.music.filter(function (m) { return m.title && !m.licenseRef; }).length : 0;
  add('PROVENANCE_CONSENT', 'Provenans aset, persetujuan wajah/suara & lisensi musik', 'CRITICAL', !noConsent.length && !badLic && !musicNoLic,
    noConsent.length + ' karakter tanpa consent, ' + badLic + ' frame UNVERIFIED, ' + musicNoLic + ' musik tanpa lisensi', 'Semua terverifikasi', 'Lengkapi nomor lisensi musik & bukti consent (UU PDP: wajah/suara = data pribadi).');
  var maxSec = getSetting_('qc').maxDurationSec, dur = sc ? sc.totalSec : 0;
  add('DURATION', 'Durasi episode', 'WARNING', dur > 0 && dur <= maxSec, dur + ' dtk', '1–' + maxSec + ' dtk', 'Pangkas adegan.', dur > 0);
  var subs = asm ? asm.subtitles : [], overlap = 0, fast = 0;
  for (var i = 0; i < subs.length; i++) {
    if (i && subs[i].startSec < subs[i - 1].endSec) overlap++;
    if (subs[i].text.length / Math.max(0.5, subs[i].endSec - subs[i].startSec) > 17) fast++;
  }
  add('SUBTITLE_ALIGNMENT', 'Sinkron & kecepatan baca subtitle', 'WARNING', subs.length > 0 && !overlap && !fast, subs.length + ' cue, ' + overlap + ' tumpang tindih, ' + fast + ' terlalu cepat', '0 tumpang tindih, ≤17 kps', 'Perbaiki timing di Assembly.', subs.length > 0);
  var gate = asm ? qualityGate_(ep, asm) : null;
  add('MOBILE_SAFE_ZONE', 'Teks aman di layar ponsel', 'WARNING', !!(gate && gate.safeArea.passed), gate ? gate.safeArea.value : '-', gate ? gate.safeArea.expected : '-', 'Pendekkan baris subtitle.', !!gate);
  add('AUDIO_LOUDNESS', 'Loudness audio (LUFS)', 'WARNING', !!(gate && gate.loudness.passed), gate && gate.loudness.value !== null ? gate.loudness.value + ' LUFS' : 'belum diukur', '-14 ±2 LUFS', 'Ukur dengan editor (mis. ffmpeg loudnorm) lalu isi di Assembly.', true);
  var hs = hookScore_(ep.hook);
  add('CLIFFHANGER_RETENTION', 'Kekuatan cliffhanger', 'INFO', hs >= getSetting_('qc').minHookScore, hs + '/100', '≥ ' + getSetting_('qc').minHookScore, 'Tajamkan hook penutup (A/B test di menu Retensi).', true);
  add('VIDEO_MASTER', 'Video master tersedia', 'CRITICAL', !!ep.videoUrl, ep.videoUrl ? 'ada' : 'kosong', 'URL video', 'Unggah video ke Drive/hosting lalu isi URL di Edit Episode.');
  add('OPEN_COMMENTS', 'Komentar review terbuka', 'INFO', comments.length === 0, comments.length + ' terbuka', '0', 'Selesaikan komentar di Kolaborasi.', true);
  var passed = checks.filter(function (c) { return c.status === 'PASSED'; }).length;
  var failed = checks.filter(function (c) { return c.status === 'FAILED'; }).length;
  var report = { episodeId: ep.id, scannedAt: nowIso_(), scannedBy: ctx.email, totalChecks: checks.length, passedChecks: passed,
    warningChecks: checks.filter(function (c) { return c.status === 'WARNING'; }).length, failedChecks: failed,
    overallScore: Math.round(passed / checks.length * 100), overallStatus: failed ? 'FAILED' : (passed === checks.length ? 'PASSED' : 'NEEDS_REVIEW'), checks: checks };
  var cur = Db.get('QC', ep.id);
  Db.upsert('QC', ep.id, { orgId: ctx.orgId, report: report, signOff: cur && cur.signOff && cur.signOff.decision === 'REVISION_REQUESTED' ? cur.signOff : null, updatedAt: nowIso_() });
  audit_(ctx, 'QC_SCAN', 'episode', ep.id, { score: report.overallScore, status: report.overallStatus });
  return Db.get('QC', ep.id);
}

function qcSignOff_(ctx, d) {
  requireRole_(ctx, ['ADMIN', 'REVIEWER']);
  var ep = ownEpisode_(ctx, d.episodeId), q = Db.get('QC', ep.id);
  assert_(q && q.report, 'NO_SCAN', 'Jalankan pemindaian QC terlebih dahulu.');
  assert_(ep.status === 'QC_PENDING', 'BAD_STATE', 'Episode harus berstatus Menunggu QC.');
  var cl = d.checklist || {};
  var keys = ['visual', 'audio', 'subtitle', 'legal', 'cliffhanger'];
  if (d.decision === 'APPROVED_FOR_RELEASE') {
    assert_(q.report.failedChecks === 0, 'QC_FAILED', 'Masih ada ' + q.report.failedChecks + ' pemeriksaan KRITIS gagal. Pindai ulang setelah diperbaiki.');
    assert_(keys.every(function (k) { return cl[k] === true; }), 'CHECKLIST', 'Semua checklist reviewer wajib dicentang.');
  }
  var signOff = { decision: d.decision === 'APPROVED_FOR_RELEASE' ? 'APPROVED_FOR_RELEASE' : 'REVISION_REQUESTED', reviewer: ctx.email, reviewerName: ctx.name,
    at: nowIso_(), notes: clean_(d.notes, 2000), checklist: cl, scoreAtSignOff: q.report.overallScore };
  Db.update('QC', ep.id, { signOff: signOff, updatedAt: nowIso_() });
  if (signOff.decision === 'APPROVED_FOR_RELEASE' && d.publish) {
    Db.update('Episodes', ep.id, { status: 'PUBLISHED', publishedAt: ep.publishedAt || nowIso_(), updatedAt: nowIso_() });
  } else if (signOff.decision === 'REVISION_REQUESTED') {
    Db.update('Episodes', ep.id, { status: 'RENDERING', updatedAt: nowIso_() });
  }
  audit_(ctx, 'QC_SIGNOFF', 'episode', ep.id, { decision: signOff.decision, published: !!d.publish });
  return Db.get('QC', ep.id);
}

/* ============================== KOLABORASI ============================== */
function commentsList_(ctx, d) {
  studioOnly_(ctx);
  ownEpisode_(ctx, d.episodeId);
  return Db.all('Comments', function (c) { return c.episodeId === d.episodeId; }).sort(function (a, b) { return a.tsSec - b.tsSec; });
}

function commentAdd_(ctx, d) {
  studioOnly_(ctx);
  var ep = ownEpisode_(ctx, d.episodeId);
  var text = clean_(d.text, 2000);
  assert_(text, 'BAD_INPUT', 'Komentar kosong.');
  var c = Db.insert('Comments', { id: uid_('cmt'), orgId: ctx.orgId, episodeId: ep.id, userId: ctx.userId, userName: ctx.name, role: ctx.role,
    tsSec: Math.max(0, toNum_(d.tsSec)), frameId: clean_(d.frameId, 40), text: text, resolved: false, resolvedBy: '', resolvedAt: '', createdAt: nowIso_() });
  audit_(ctx, 'COMMENT_ADD', 'episode', ep.id, { at: c.tsSec });
  return c;
}

function commentResolve_(ctx, d) {
  studioOnly_(ctx);
  var c = Db.get('Comments', d.id);
  assert_(c && c.orgId === ctx.orgId, 'NOT_FOUND', 'Komentar tidak ditemukan.');
  var r = !c.resolved;
  return Db.update('Comments', c.id, { resolved: r, resolvedBy: r ? ctx.email : '', resolvedAt: r ? nowIso_() : '' });
}

/** Paket produksi + sertifikat (manifest JSON). Opsional disimpan ke Drive. */
function bundleExport_(ctx, d) {
  studioOnly_(ctx);
  var ep = ownEpisode_(ctx, d.episodeId), s = Db.get('Series', ep.seriesId), sc = latestScript_(ep.id);
  var asm = Db.get('Assembly', ep.id), q = Db.get('QC', ep.id), org = Db.get('Orgs', ctx.orgId) || {};
  var frames = Db.all('Frames', function (f) { return f.episodeId === ep.id; });
  var chars = Db.all('Characters', function (c) { return c.seriesId === s.id; });
  var manifest = {
    generator: APP.NAME + ' ' + APP.VERSION, generatedAt: nowIso_(), organization: org.name,
    series: { id: s.id, title: s.title, genre: s.genre }, episode: { id: ep.id, number: ep.number, title: ep.title, status: ep.status, videoUrl: ep.videoUrl, durationSec: ep.durationSec },
    spec: { aspectRatio: '9:16', resolution: asm && asm.data ? asm.data.resolution : '1080x1920', audio: '-14 LUFS AAC 192kbps' },
    script: sc ? { version: sc.version, approvedBy: sc.approvedBy, scenes: sc.scenes, hook: sc.hook } : null,
    characters: chars.map(function (c) { return { name: c.name, consentType: c.consentType, consentRef: c.consentRef }; }),
    storyboard: frames.map(function (f) { return { scene: f.sceneNo, shot: f.shotNo, imageUrl: f.imageUrl, license: f.license, provider: f.provider, checksum: f.checksum, status: f.status }; }),
    music: asm && asm.data ? asm.data.music : [], subtitlesSrt: asm && asm.data ? toSrt_(asm.data.subtitles) : '',
    qc: q ? { score: q.report && q.report.overallScore, signOff: q.signOff } : null
  };
  manifest.checksum = sha256Hex_(JSON.stringify(manifest));
  manifest.certificate = { bundleId: 'BND-' + manifest.checksum.slice(0, 10).toUpperCase(), certifiedBy: q && q.signOff ? q.signOff.reviewer : '(belum sign-off)', licenseItems: frames.length + chars.length + manifest.music.length };
  if (d.toDrive) {
    var file = getMediaFolder_().createFile('bundle_' + s.title.replace(/[^\w]+/g, '_') + '_ep' + ep.number + '.json', JSON.stringify(manifest, null, 2), MimeType.PLAIN_TEXT);
    manifest.driveUrl = file.getUrl();
  }
  audit_(ctx, 'BUNDLE_EXPORT', 'episode', ep.id, { bundleId: manifest.certificate.bundleId });
  return manifest;
}

/**
 * 07_Viewer.gs — Katalog publik, pemutar 9:16, engagement, dompet koin, top-up, paywall, royalti
 * Perbaikan: top-up koin TIDAK lagi gratis (wajib verifikasi admin), paywall terikat organisasi,
 * unlock memvalidasi episode ∈ serial & episode gratis, like/bookmark per pengguna (bukan global).
 */

function paywallOf_(seriesId) {
  var p = Db.get('Paywall', seriesId), def = getSetting_('defaults');
  return p || { id: seriesId, freeCount: def.freeCount, coinsPerEp: def.coinsPerEp, seasonPrice: def.seasonPrice, enabled: true };
}

function isFreeEpisode_(ep, pw) {
  if (!License.status().features.monetization) return true;
  return !pw.enabled || ep.isFree || ep.number <= pw.freeCount;
}

function hasAccess_(userId, ep, pw) {
  if (isFreeEpisode_(ep, pw)) return true;
  if (!userId) return false;
  return Db.all('Unlocks', function (u) { return u.userId === userId && (u.episodeId === ep.id || (u.type === 'SEASON' && u.seriesId === ep.seriesId)); }).length > 0;
}

function engagementStats_(episodeIds, userId) {
  var set = {}; episodeIds.forEach(function (id) { set[id] = { views: 0, likes: 0, bookmarks: 0, shares: 0, watchSum: 0, watchN: 0, completes: 0, liked: false, bookmarked: false }; });
  var likeState = {}, bmState = {};
  Db.all('Engagement', function (g) { return set[g.episodeId]; }).forEach(function (g) {
    var s = set[g.episodeId];
    if (g.type === 'VIEW') s.views++;
    else if (g.type === 'SHARE') s.shares++;
    else if (g.type === 'WATCH') { s.watchSum += g.value; s.watchN++; if (g.value >= 90) s.completes++; }
    else if (g.type === 'LIKE') likeState[g.episodeId + '|' + g.userId] = g.value > 0;
    else if (g.type === 'BOOKMARK') bmState[g.episodeId + '|' + g.userId] = g.value > 0;
  });
  Object.keys(likeState).forEach(function (k) { var p = k.split('|'); if (likeState[k]) { set[p[0]].likes++; if (p[1] === userId) set[p[0]].liked = true; } });
  Object.keys(bmState).forEach(function (k) { var p = k.split('|'); if (bmState[k]) { set[p[0]].bookmarks++; if (p[1] === userId) set[p[0]].bookmarked = true; } });
  Object.keys(set).forEach(function (id) { var s = set[id]; s.avgWatchPct = s.watchN ? Math.round(s.watchSum / s.watchN) : 0; s.completionPct = s.watchN ? Math.round(s.completes / s.watchN * 100) : 0; delete s.watchSum; });
  return set;
}

/** Katalog publik: hanya episode berstatus PUBLISHED */
function catalogList_(ctx, d) {
  var eps = Db.all('Episodes', function (e) { return e.status === 'PUBLISHED'; });
  var bySeries = {};
  eps.forEach(function (e) { (bySeries[e.seriesId] = bySeries[e.seriesId] || []).push(e); });
  var viewerId = ctx.userId || (d && d.deviceId ? 'dev-' + String(d.deviceId).slice(0, 40) : '');
  var stats = engagementStats_(eps.map(function (e) { return e.id; }), viewerId);
  var unlocked = {};
  if (ctx.userId) Db.all('Unlocks', function (u) { return u.userId === ctx.userId; }).forEach(function (u) { unlocked[u.type === 'SEASON' ? 'S:' + u.seriesId : u.episodeId] = true; });
  return Db.all('Series', function (s) { return bySeries[s.id] && s.status !== 'ARCHIVED'; }).map(function (s) {
    var pw = paywallOf_(s.id);
    var list = bySeries[s.id].sort(function (a, b) { return a.number - b.number; }).map(function (e) {
      var free = isFreeEpisode_(e, pw);
      return { id: e.id, number: e.number, title: e.title, hook: e.hook, durationSec: e.durationSec, thumbUrl: e.thumbUrl, free: free,
        unlocked: free || !!unlocked[e.id] || !!unlocked['S:' + s.id], stats: stats[e.id] };
    });
    var totalViews = list.reduce(function (a, e) { return a + e.stats.views; }, 0);
    return { id: s.id, title: s.title, genre: s.genre, logline: s.logline, coverUrl: s.coverUrl, tags: s.tags, plannedEps: s.plannedEps,
      paywall: { coinsPerEp: pw.coinsPerEp, seasonPrice: pw.seasonPrice, freeCount: pw.freeCount, enabled: pw.enabled && License.status().features.monetization },
      seasonPass: !!unlocked['S:' + s.id], episodes: list, views: totalViews };
  }).sort(function (a, b) { return b.views - a.views; });
}

function viewerPlayback_(ctx, d) {
  var ep = Db.get('Episodes', d.episodeId);
  assert_(ep && ep.status === 'PUBLISHED', 'NOT_FOUND', 'Episode tidak tersedia.');
  var s = Db.get('Series', ep.seriesId), pw = paywallOf_(s.id);
  var access = hasAccess_(ctx.userId, ep, pw);
  var asm = Db.get('Assembly', ep.id);
  var viewerId = ctx.userId || (d.deviceId ? 'dev-' + String(d.deviceId).slice(0, 40) : '');
  var siblings = Db.all('Episodes', function (e) { return e.seriesId === s.id && e.status === 'PUBLISHED'; }).sort(function (a, b) { return a.number - b.number; });
  var idx = siblings.map(function (e) { return e.id; }).indexOf(ep.id);
  var dubs = Db.all('Dubs', function (x) { return x.episodeId === ep.id && x.status === 'READY'; }).map(function (x) { return { lang: x.lang, subtitles: x.subtitles }; });
  return {
    episode: { id: ep.id, number: ep.number, title: ep.title, hook: ep.hook, durationSec: ep.durationSec, thumbUrl: ep.thumbUrl, seriesId: s.id },
    series: { id: s.id, title: s.title, genre: s.genre },
    locked: !access, price: pw.coinsPerEp, seasonPrice: pw.seasonPrice,
    videoUrl: access ? ep.videoUrl : '', subtitles: access && asm && asm.data ? asm.data.subtitles : [], dubs: access ? dubs : [],
    prevId: idx > 0 ? siblings[idx - 1].id : '', nextId: idx >= 0 && idx < siblings.length - 1 ? siblings[idx + 1].id : '',
    stats: engagementStats_([ep.id], viewerId)[ep.id], hooks: activeHook_(ep.id)
  };
}

/** Varian hook A/B aktif untuk episode ini (dipilih acak sesuai alokasi trafik) */
function activeHook_(epId) {
  var hs = Db.all('Hooks', function (h) { return h.episodeId === epId; });
  if (!hs.length) return null;
  var win = hs.filter(function (h) { return h.winning; })[0];
  if (win) return { id: win.id, code: win.code, text: win.text, tsSec: win.tsSec };
  var r = Math.random() * 100, acc = 0;
  for (var i = 0; i < hs.length; i++) { acc += toNum_(hs[i].traffic, 50); if (r <= acc) return { id: hs[i].id, code: hs[i].code, text: hs[i].text, tsSec: hs[i].tsSec }; }
  return { id: hs[0].id, code: hs[0].code, text: hs[0].text, tsSec: hs[0].tsSec };
}

function viewerEngage_(ctx, d) {
  var ep = Db.get('Episodes', d.episodeId);
  assert_(ep && ep.status === 'PUBLISHED', 'NOT_FOUND', 'Episode tidak tersedia.');
  var type = String(d.type || '').toUpperCase();
  assert_(['VIEW', 'LIKE', 'BOOKMARK', 'SHARE', 'WATCH', 'HOOK_VIEW', 'HOOK_CONTINUE'].indexOf(type) >= 0, 'BAD_TYPE', 'Tipe engagement tidak valid.');
  var who = ctx.userId || (d.deviceId ? 'dev-' + String(d.deviceId).slice(0, 40) : '');
  assert_(who, 'NEED_ID', 'Butuh identitas perangkat.');
  var cache = CacheService.getScriptCache();
  if (type === 'VIEW') {
    var k = 'v_' + ep.id + '_' + who;
    if (cache.get(k)) return { dedup: true };
    cache.put(k, '1', 1800);
  }
  var value = 1;
  if (type === 'LIKE' || type === 'BOOKMARK') {
    var st = engagementStats_([ep.id], who)[ep.id];
    value = (type === 'LIKE' ? st.liked : st.bookmarked) ? -1 : 1;
  }
  if (type === 'WATCH') value = Math.max(0, Math.min(100, Math.round(toNum_(d.value))));
  if (type === 'HOOK_VIEW' || type === 'HOOK_CONTINUE') {
    var h = Db.get('Hooks', d.hookId);
    if (h && h.episodeId === ep.id) Db.update('Hooks', h.id, type === 'HOOK_VIEW' ? { views: h.views + 1 } : { completes: h.completes + 1 });
    return { ok: true };
  }
  Db.insert('Engagement', { id: uid_('eng'), episodeId: ep.id, seriesId: ep.seriesId, userId: who, type: type, value: value, createdAt: nowIso_() });
  return engagementStats_([ep.id], who)[ep.id];
}

/* ================================ DOMPET ================================ */
function walletOf_(userId) {
  return Db.get('Wallets', userId) || { id: userId, balance: 0, spent: 0 };
}

function walletGet_(ctx) {
  requireRole_(ctx);
  var w = walletOf_(ctx.userId);
  return {
    balance: w.balance, spent: w.spent,
    unlocks: Db.all('Unlocks', function (u) { return u.userId === ctx.userId; }).reverse().slice(0, 50),
    topups: Db.all('TopUps', function (t) { return t.userId === ctx.userId; }).reverse().slice(0, 20),
    packages: getSetting_('coinPackages'), payment: getSetting_('payment')
  };
}

function walletUnlock_(ctx, d) {
  requireRole_(ctx);
  assert_(License.status().features.monetization, 'TIER', 'Fitur monetisasi tidak aktif pada lisensi ini.');
  var w = walletOf_(ctx.userId), price, rec;
  if (d.season) {
    var s = Db.get('Series', d.seriesId);
    assert_(s, 'NOT_FOUND', 'Serial tidak ditemukan.');
    var pw = paywallOf_(s.id);
    assert_(!Db.all('Unlocks', function (u) { return u.userId === ctx.userId && u.type === 'SEASON' && u.seriesId === s.id; }).length, 'ALREADY', 'Season pass sudah aktif.');
    price = pw.seasonPrice;
    rec = { id: uid_('unl'), userId: ctx.userId, orgId: s.orgId, seriesId: s.id, episodeId: '', type: 'SEASON', coins: price, createdAt: nowIso_() };
  } else {
    var ep = Db.get('Episodes', d.episodeId);
    assert_(ep && ep.status === 'PUBLISHED', 'NOT_FOUND', 'Episode tidak tersedia.');
    var pw2 = paywallOf_(ep.seriesId);
    if (hasAccess_(ctx.userId, ep, pw2)) return { already: true, wallet: walletGet_(ctx) };
    price = pw2.coinsPerEp;
    rec = { id: uid_('unl'), userId: ctx.userId, orgId: ep.orgId, seriesId: ep.seriesId, episodeId: ep.id, type: 'EPISODE', coins: price, createdAt: nowIso_() };
  }
  assert_(w.balance >= price, 'INSUFFICIENT', 'Koin tidak cukup. Butuh ' + price + ', saldo ' + w.balance + '. Silakan isi ulang.');
  Db.upsert('Wallets', ctx.userId, { balance: w.balance - price, spent: w.spent + price, updatedAt: nowIso_() });
  Db.insert('Unlocks', rec);
  audit_(ctx, 'COIN_UNLOCK', rec.type.toLowerCase(), rec.episodeId || rec.seriesId, { coins: price });
  return { ok: true, wallet: walletGet_(ctx) };
}

function topupRequest_(ctx, d) {
  requireRole_(ctx);
  var pk = (getSetting_('coinPackages') || []).filter(function (p) { return p.id === d.packageId; })[0];
  assert_(pk, 'BAD_PACKAGE', 'Paket koin tidak ditemukan.');
  assert_(clean_(d.proofUrl).length > 5, 'NEED_PROOF', 'Unggah bukti transfer terlebih dahulu.');
  var pending = Db.all('TopUps', function (t) { return t.userId === ctx.userId && t.status === 'PENDING'; }).length;
  assert_(pending < 3, 'TOO_MANY', 'Masih ada ' + pending + ' permintaan menunggu verifikasi.');
  var t = Db.insert('TopUps', { id: uid_('top'), userId: ctx.userId, userName: ctx.name + ' <' + ctx.email + '>', packageId: pk.id, coins: pk.coins + (pk.bonus || 0),
    amountIdr: pk.priceIdr, method: clean_(d.method, 40) || 'TRANSFER', proofUrl: clean_(d.proofUrl, 500), status: 'PENDING', reviewedBy: '', reviewedAt: '', note: clean_(d.note, 300), createdAt: nowIso_() });
  notifyRole_('', 'ADMIN', '💰 Top-up baru ' + t.coins + ' koin (Rp' + pk.priceIdr.toLocaleString('id-ID') + ') dari ' + ctx.name + '. Verifikasi di menu Monetisasi.');
  audit_(ctx, 'TOPUP_REQUEST', 'topup', t.id, { coins: t.coins, idr: t.amountIdr });
  return t;
}

function topupList_(ctx, d) {
  requireRole_(ctx, ['ADMIN']);
  return Db.all('TopUps', function (t) { return !d.status || t.status === d.status; }).reverse().slice(0, 200);
}

function topupReview_(ctx, d) {
  requireRole_(ctx, ['ADMIN']);
  var t = Db.get('TopUps', d.id);
  assert_(t && t.status === 'PENDING', 'NOT_FOUND', 'Permintaan tidak ditemukan / sudah diproses.');
  var approve = d.decision === 'APPROVE';
  Db.update('TopUps', t.id, { status: approve ? 'APPROVED' : 'REJECTED', reviewedBy: ctx.email, reviewedAt: nowIso_(), note: clean_(d.note, 300) || t.note });
  if (approve) {
    var w = walletOf_(t.userId);
    Db.upsert('Wallets', t.userId, { balance: w.balance + t.coins, spent: w.spent, updatedAt: nowIso_() });
  }
  var u = Db.get('Users', t.userId);
  if (u && u.phone) sendWa_(u.phone, approve ? '✅ Top-up ' + t.coins + ' koin berhasil. Selamat menonton!' : '❌ Top-up ditolak: ' + (clean_(d.note) || 'bukti tidak valid') + '.');
  audit_(ctx, approve ? 'TOPUP_APPROVE' : 'TOPUP_REJECT', 'topup', t.id, { coins: t.coins, user: t.userId });
  return Db.get('TopUps', t.id);
}

/* ================================ PAYWALL ================================ */
function paywallGet_(ctx, d) {
  studioOnly_(ctx);
  ownSeries_(ctx, d.seriesId);
  return paywallOf_(d.seriesId);
}

function paywallSave_(ctx, d) {
  requireRole_(ctx, ['ADMIN']);
  var s = ownSeries_(ctx, d.seriesId);
  var rec = { orgId: ctx.orgId, freeCount: Math.max(0, Math.min(50, Math.round(toNum_(d.freeCount)))), coinsPerEp: Math.max(1, Math.min(10000, Math.round(toNum_(d.coinsPerEp, 15)))),
    seasonPrice: Math.max(1, Math.min(100000, Math.round(toNum_(d.seasonPrice, 150)))), enabled: d.enabled !== false, updatedAt: nowIso_() };
  Db.upsert('Paywall', s.id, rec);
  audit_(ctx, 'PAYWALL_UPDATE', 'series', s.id, rec);
  return paywallOf_(s.id);
}

/** Royalti dihitung dari transaksi koin nyata */
function royaltyGet_(ctx, d) {
  requireRole_(ctx, ['ADMIN', 'CREATOR']);
  var eco = getSetting_('economics');
  var series = d.seriesId ? [ownSeries_(ctx, d.seriesId)] : Db.all('Series', function (s) { return s.orgId === ctx.orgId; });
  return series.map(function (s) {
    var un = Db.all('Unlocks', function (u) { return u.seriesId === s.id; });
    var coins = un.reduce(function (a, u) { return a + u.coins; }, 0);
    var payers = {}; un.forEach(function (u) { payers[u.userId] = 1; });
    var viewers = {}; Db.all('Engagement', function (g) { return g.seriesId === s.id && g.type === 'VIEW'; }).forEach(function (g) { viewers[g.userId] = 1; });
    var gross = coins * eco.coinValueIdr, fee = Math.round(gross * eco.platformFeePct / 100);
    var nP = Object.keys(payers).length, nV = Object.keys(viewers).length;
    return { seriesId: s.id, title: s.title, coins: coins, grossIdr: gross, platformFeeIdr: fee, netIdr: gross - fee, feePct: eco.platformFeePct,
      payers: nP, viewers: nV, conversionPct: nV ? Math.round(nP / nV * 1000) / 10 : 0, arpuIdr: nP ? Math.round(gross / nP) : 0,
      seasonPasses: un.filter(function (u) { return u.type === 'SEASON'; }).length, episodeUnlocks: un.filter(function (u) { return u.type === 'EPISODE'; }).length };
  });
}

/**
 * 08_Growth.gs — Lokalisasi subtitle, preset sindikasi, A/B hook, analitik retensi nyata
 */

var LANGS = { id: 'Indonesia', en: 'English', ms: 'Melayu', es: 'Español', ja: '日本語', zh: '中文', ko: '한국어', th: 'ไทย', vi: 'Tiếng Việt', ar: 'العربية', fr: 'Français', pt: 'Português', tl: 'Filipino', su: 'Sunda', jv: 'Jawa' };

function dubList_(ctx, d) {
  studioOnly_(ctx);
  ownEpisode_(ctx, d.episodeId);
  return { langs: LANGS, tracks: Db.all('Dubs', function (x) { return x.episodeId === d.episodeId; }) };
}

/** Terjemahkan subtitle memakai LanguageApp (gratis, bawaan Google) — fallback Gemini bila diminta */
function dubTranslate_(ctx, d) {
  requireRole_(ctx, ['ADMIN', 'CREATOR']);
  var ep = ownEpisode_(ctx, d.episodeId), s = Db.get('Series', ep.seriesId);
  assert_(LANGS[d.lang], 'BAD_LANG', 'Bahasa tidak didukung.');
  var asm = Db.get('Assembly', ep.id);
  assert_(asm && asm.data && asm.data.subtitles.length, 'NO_SUBS', 'Buka menu Assembly dulu agar subtitle terbentuk.');
  var src = s.language || 'id', subs = asm.data.subtitles, out;
  if (d.engine === 'AI') {
    var res = Ai.generateJson(ctx, 'TRANSLATE', 'Terjemahkan subtitle drama berikut ke bahasa ' + LANGS[d.lang] + '. Pertahankan emosi, nada, dan panjang ringkas (maks 84 karakter). ' +
      'Keluarkan JSON {"lines":[string]} dengan jumlah elemen sama persis.\n' + JSON.stringify(subs.map(function (x) { return x.text; })), ep.id);
    out = subs.map(function (x, i) { return { index: x.index, startSec: x.startSec, endSec: x.endSec, speaker: x.speaker, text: clean_((res.lines || [])[i] || x.text, 300) }; });
  } else {
    // Gabung per batch agar hemat kuota LanguageApp
    var SEP = '\n¶\n', texts = subs.map(function (x) { return x.text; }), translated = [];
    for (var i = 0; i < texts.length; i += 40) {
      var chunk = texts.slice(i, i + 40), joined = chunk.join(SEP);
      var tr = LanguageApp.translate(joined, src === d.lang ? '' : src, d.lang).split(/\s*¶\s*/);
      if (tr.length !== chunk.length) tr = chunk.map(function (t) { return LanguageApp.translate(t, src, d.lang); });
      translated = translated.concat(tr);
    }
    out = subs.map(function (x, i) { return { index: x.index, startSec: x.startSec, endSec: x.endSec, speaker: x.speaker, text: clean_(translated[i], 300) }; });
  }
  var id = ep.id + '_' + d.lang;
  Db.upsert('Dubs', id, { orgId: ctx.orgId, episodeId: ep.id, lang: d.lang, subtitles: out, voice: clean_(d.voice, 120), status: 'READY', updatedAt: nowIso_() });
  audit_(ctx, 'SUBTITLE_TRANSLATE', 'episode', ep.id, { lang: d.lang, engine: d.engine || 'LanguageApp', cues: out.length });
  return Db.get('Dubs', id);
}

var SYND_PRESETS = {
  TIKTOK: { name: 'TikTok (vertikal)', res: '1080x1920', fps: 30, vbr: 6, lufs: -14, maxSec: 600, note: 'Pasang subtitle burn-in di area aman tengah (hindari 15% bawah & 10% kanan).' },
  YOUTUBE_SHORTS: { name: 'YouTube Shorts', res: '1080x1920', fps: 30, vbr: 8, lufs: -14, maxSec: 180, note: 'Durasi > 3 menit tidak dihitung sebagai Shorts.' },
  REELS: { name: 'Instagram / Facebook Reels', res: '1080x1920', fps: 30, vbr: 5, lufs: -14, maxSec: 180, note: 'Cek batas durasi terbaru di aplikasi Meta.' },
  VERTICAL_DRAMA_PARTNER: { name: 'Platform drama vertikal mitra (generik)', res: '1080x1920', fps: 30, vbr: 4, lufs: -16, maxSec: 180, note: 'Distribusi ke platform pihak ketiga memerlukan kontrak lisensi; sesuaikan spesifikasi dengan dokumen ingest mitra.' },
  WEB_HLS: { name: 'Web/PWA sendiri (MP4 progresif)', res: '720x1280', fps: 30, vbr: 2.5, lufs: -14, maxSec: 600, note: 'Versi hemat kuota untuk pemutar CineAI.' }
};

function syndicationList_(ctx, d) {
  studioOnly_(ctx);
  ownEpisode_(ctx, d.episodeId);
  return { presets: SYND_PRESETS, packages: Db.all('Syndication', function (x) { return x.episodeId === d.episodeId; }).reverse() };
}

function syndicationCreate_(ctx, d) {
  requireRole_(ctx, ['ADMIN', 'CREATOR']);
  var ep = ownEpisode_(ctx, d.episodeId), p = SYND_PRESETS[d.platform];
  assert_(p, 'BAD_PLATFORM', 'Preset tidak dikenal.');
  var dims = p.res.split('x');
  var safe = (ep.title || 'episode').replace(/[^\w]+/g, '_');
  var ffmpeg = 'ffmpeg -i master.mp4 -vf "scale=' + dims[0] + ':' + dims[1] + ':force_original_aspect_ratio=decrease,pad=' + dims[0] + ':' + dims[1] + ':(ow-iw)/2:(oh-ih)/2,fps=' + p.fps +
    '" -c:v libx264 -preset veryfast -b:v ' + p.vbr + 'M -maxrate ' + (p.vbr * 1.5) + 'M -bufsize ' + (p.vbr * 2) + 'M -c:a aac -b:a 192k -af loudnorm=I=' + p.lufs + ':TP=-1.5:LRA=11 -movflags +faststart ' + safe + '_' + d.platform.toLowerCase() + '.mp4';
  var checks = [
    { item: 'Durasi ≤ ' + p.maxSec + ' dtk', ok: ep.durationSec > 0 && ep.durationSec <= p.maxSec },
    { item: 'Episode sudah lolos QC', ok: !!(Db.get('QC', ep.id) || {}).signOff },
    { item: 'Video master tersedia', ok: !!ep.videoUrl }
  ];
  var rec = Db.insert('Syndication', { id: uid_('syn'), orgId: ctx.orgId, episodeId: ep.id, platform: d.platform,
    preset: { spec: p, ffmpeg: ffmpeg, checks: checks, caption: ep.title + ' — ' + (ep.hook || '') + ' #dramavertikal #drama' }, status: checks.every(function (c) { return c.ok; }) ? 'READY' : 'BLOCKED', createdAt: nowIso_() });
  audit_(ctx, 'SYNDICATION_PACKAGE', 'episode', ep.id, { platform: d.platform, status: rec.status });
  return rec;
}

/* ================================ HOOK A/B ================================ */
function hooksList_(ctx, d) {
  studioOnly_(ctx);
  ownEpisode_(ctx, d.episodeId);
  return Db.all('Hooks', function (h) { return h.episodeId === d.episodeId; }).map(function (h) {
    h.continuePct = h.views ? Math.round(h.completes / h.views * 1000) / 10 : 0;
    h.score = hookScore_(h.text);
    return h;
  });
}

function hooksGenerate_(ctx, d) {
  requireRole_(ctx, ['ADMIN', 'CREATOR']);
  var ep = ownEpisode_(ctx, d.episodeId), sc = latestScript_(ep.id);
  var res = Ai.generateJson(ctx, 'HOOK_VARIANTS', 'Buat 3 variasi cliffhanger penutup (maks 160 karakter, bahasa Indonesia, orisinal) untuk episode drama vertikal berikut. ' +
    'Masing-masing pendekatan berbeda: (A) pengungkapan rahasia, (B) ancaman/bahaya, (C) pertanyaan emosional. JSON: {"variants":[{"text":string,"angle":string}]}\n' +
    'Judul: ' + ep.title + '\nHook saat ini: ' + ep.hook + '\nRingkasan: ' + (sc ? sc.scenes.map(function (s) { return s.summary; }).join(' ') : '').slice(0, 4000), ep.id);
  var codes = ['A', 'B', 'C'], existing = Db.all('Hooks', function (h) { return h.episodeId === ep.id; }).length;
  var rows = (res.variants || []).slice(0, 3).map(function (v, i) {
    return { id: uid_('hk'), orgId: ctx.orgId, episodeId: ep.id, code: codes[i] + (existing ? existing + 1 : ''), text: clean_(v.text, 300), tsSec: Math.max(0, ep.durationSec - 6), traffic: Math.round(100 / 3),
      views: 0, completes: 0, conversions: 0, winning: false, model: getSetting_('ai').model, updatedAt: nowIso_() };
  });
  Db.insertMany('Hooks', rows);
  return hooksList_(ctx, d);
}

function hooksSave_(ctx, d) {
  requireRole_(ctx, ['ADMIN', 'CREATOR']);
  var ep = ownEpisode_(ctx, d.episodeId);
  if (d.deleteId) { var hd = Db.get('Hooks', d.deleteId); assert_(hd && hd.episodeId === ep.id, 'NOT_FOUND', 'Varian tidak ada.'); Db.remove('Hooks', hd.id); return hooksList_(ctx, d); }
  if (d.promoteId) {
    Db.all('Hooks', function (h) { return h.episodeId === ep.id; }).forEach(function (h) { Db.update('Hooks', h.id, { winning: h.id === d.promoteId, traffic: h.id === d.promoteId ? 100 : 0 }); });
    var w = Db.get('Hooks', d.promoteId);
    Db.update('Episodes', ep.id, { hook: w.text, updatedAt: nowIso_() });
    audit_(ctx, 'HOOK_PROMOTE', 'episode', ep.id, { variant: w.code });
    return hooksList_(ctx, d);
  }
  var text = clean_(d.text, 300);
  assert_(text.length >= 10, 'BAD_INPUT', 'Teks hook minimal 10 karakter.');
  if (d.id) Db.update('Hooks', d.id, { text: text, traffic: Math.max(0, Math.min(100, toNum_(d.traffic, 50))), updatedAt: nowIso_() });
  else Db.insert('Hooks', { id: uid_('hk'), orgId: ctx.orgId, episodeId: ep.id, code: clean_(d.code, 4) || 'M', text: text, tsSec: Math.max(0, ep.durationSec - 6),
    traffic: Math.max(0, Math.min(100, toNum_(d.traffic, 50))), views: 0, completes: 0, conversions: 0, winning: false, model: 'manual', updatedAt: nowIso_() });
  return hooksList_(ctx, d);
}

/** Kurva retensi dari event WATCH nyata (persentase tonton maksimum per penonton) */
function retentionGet_(ctx, d) {
  studioOnly_(ctx);
  var ep = ownEpisode_(ctx, d.episodeId), maxPct = {};
  var events = Db.all('Engagement', function (g) { return g.episodeId === ep.id; });
  events.forEach(function (g) { if (g.type === 'WATCH') maxPct[g.userId] = Math.max(maxPct[g.userId] || 0, g.value); });
  var viewers = Object.keys(maxPct), n = viewers.length, curve = [];
  for (var b = 0; b <= 100; b += 10) {
    var keep = viewers.filter(function (v) { return maxPct[v] >= b; }).length;
    curve.push({ pct: b, sec: Math.round(ep.durationSec * b / 100), retention: n ? Math.round(keep / n * 1000) / 10 : 0 });
  }
  var worst = null;
  for (var i = 1; i < curve.length; i++) { var drop = curve[i - 1].retention - curve[i].retention; if (!worst || drop > worst.drop) worst = { at: curve[i].sec, drop: Math.round(drop * 10) / 10 }; }
  var sc = latestScript_(ep.id), marks = [], t = 0;
  if (sc) sc.scenes.forEach(function (s) { marks.push({ sec: t, label: 'Adegan ' + s.sceneNumber + ': ' + s.setting }); t += s.estimatedSeconds; });
  var st = engagementStats_([ep.id], '')[ep.id];
  var rating = !n ? 'NO_DATA' : (st.completionPct >= 70 ? 'EXCELLENT' : st.completionPct >= 45 ? 'STRONG' : 'AT_RISK');
  return { viewers: n, curve: curve, worstDrop: worst, sceneMarks: marks, stats: st, rating: rating, hookScore: hookScore_(ep.hook) };
}

/**
 * 09_AI.gs — Adapter Gemini API (UrlFetchApp) + pagar anggaran (pre-flight budget, kill switch)
 * Kunci API disimpan di Script Properties (GEMINI_API_KEY), tidak pernah dikirim ke klien.
 */

function aiSpentToday_(orgId) {
  var today = todayKey_();
  return Math.round(Db.all('AiUsage', function (u) { return u.orgId === orgId && Utilities.formatDate(new Date(u.createdAt), Session.getScriptTimeZone() || 'Asia/Jakarta', 'yyyy-MM-dd') === today; })
    .reduce(function (s, u) { return s + u.costUsd; }, 0) * 10000) / 10000;
}

var Ai = {
  cfg: function () { return getSetting_('ai'); },

  preflight: function (ctx, estUsd, episodeId) {
    assert_(License.status().features.ai, 'TIER', 'Fitur AI hanya tersedia pada lisensi Pro/Studio.');
    assert_(prop_('GEMINI_API_KEY'), 'NO_KEY', 'Kunci Gemini API belum diatur (menu Anggaran AI).');
    var org = Db.get('Orgs', ctx.orgId) || {};
    assert_(!org.killSwitch, 'KILL_SWITCH', 'AI dimatikan sementara oleh admin (kill switch).');
    var spent = aiSpentToday_(ctx.orgId);
    assert_(spent + estUsd <= toNum_(org.dailyCapUsd, 5), 'BUDGET_DAILY', 'Batas anggaran harian $' + org.dailyCapUsd + ' akan terlampaui (terpakai $' + spent.toFixed(4) + ', estimasi $' + estUsd.toFixed(4) + ').');
    if (episodeId) {
      var epSpent = Db.all('AiUsage', function (u) { return u.episodeId === episodeId; }).reduce(function (s, u) { return s + u.costUsd; }, 0);
      assert_(epSpent + estUsd <= toNum_(org.episodeCapUsd, 1), 'BUDGET_EPISODE', 'Batas anggaran per episode $' + org.episodeCapUsd + ' akan terlampaui (terpakai $' + epSpent.toFixed(4) + ').');
    }
  },

  log: function (ctx, feature, model, inT, outT, cost, episodeId) {
    Db.insert('AiUsage', { id: uid_('ai'), orgId: ctx.orgId, userId: ctx.userId, feature: feature, model: model, inTokens: inT, outTokens: outT,
      costUsd: Math.round(cost * 1000000) / 1000000, episodeId: episodeId || '', createdAt: nowIso_() });
  },

  call_: function (model, body) {
    var url = 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent';
    var opt = { method: 'post', contentType: 'application/json', headers: { 'x-goog-api-key': prop_('GEMINI_API_KEY') }, payload: JSON.stringify(body), muteHttpExceptions: true };
    var last;
    for (var attempt = 0; attempt < 3; attempt++) {
      var res = UrlFetchApp.fetch(url, opt), code = res.getResponseCode();
      if (code === 200) return JSON.parse(res.getContentText());
      last = code + ' ' + res.getContentText().slice(0, 300);
      if (code !== 429 && code < 500) break;
      Utilities.sleep(2000 * Math.pow(2, attempt));
    }
    assert_(false, 'AI_PROVIDER', 'Gemini API gagal: ' + last);
  },

  generateJson: function (ctx, feature, prompt, episodeId) {
    var c = this.cfg(), inEst = Math.ceil(prompt.length / 3.5), outEst = 3000;
    var est = inEst / 1e6 * c.priceInPerM + outEst / 1e6 * c.priceOutPerM;
    this.preflight(ctx, est, episodeId);
    var json = this.call_(c.model, {
      contents: [{ role: 'user', parts: [{ text: prompt }] }],
      generationConfig: { responseMimeType: 'application/json', temperature: 0.9, maxOutputTokens: 8192 },
      safetySettings: [{ category: 'HARM_CATEGORY_SEXUALLY_EXPLICIT', threshold: 'BLOCK_MEDIUM_AND_ABOVE' }, { category: 'HARM_CATEGORY_HATE_SPEECH', threshold: 'BLOCK_MEDIUM_AND_ABOVE' }]
    });
    var u = json.usageMetadata || {}, inT = u.promptTokenCount || inEst, outT = (u.candidatesTokenCount || 0) + (u.thoughtsTokenCount || 0);
    var cost = inT / 1e6 * c.priceInPerM + outT / 1e6 * c.priceOutPerM;
    this.log(ctx, feature, c.model, inT, outT, cost, episodeId);
    var cand = (json.candidates || [])[0];
    assert_(cand && cand.content && cand.content.parts, 'AI_EMPTY', 'AI tidak mengembalikan hasil (mungkin diblokir filter keamanan).');
    var text = cand.content.parts.map(function (p) { return p.text || ''; }).join('').replace(/^```(json)?\s*|\s*```$/g, '');
    try { return JSON.parse(text); } catch (e) {
      var m = text.match(/\{[\s\S]*\}/);
      if (m) return JSON.parse(m[0]);
      assert_(false, 'AI_PARSE', 'Format jawaban AI tidak valid. Coba lagi.');
    }
  },

  generateImage: function (ctx, prompt, episodeId) {
    var c = this.cfg(), model = c.imageModel || 'gemini-2.5-flash-image', price = toNum_(c.pricePerImage, 0.039);
    this.preflight(ctx, price, episodeId);
    var json = this.call_(model, {
      contents: [{ role: 'user', parts: [{ text: prompt }] }],
      generationConfig: { responseModalities: ['IMAGE'], imageConfig: { aspectRatio: '9:16' } }
    });
    var parts = (((json.candidates || [])[0] || {}).content || {}).parts || [];
    var img = parts.filter(function (p) { return p.inlineData || p.inline_data; })[0];
    assert_(img, 'AI_EMPTY', 'Model tidak menghasilkan gambar.');
    var inl = img.inlineData || img.inline_data;
    var blob = Utilities.newBlob(Utilities.base64Decode(inl.data), inl.mimeType || inl.mime_type || 'image/png', 'frame_' + Date.now() + '.png');
    var f = saveToDrive_(blob);
    this.log(ctx, 'IMAGE_GEN', model, 0, 0, price, episodeId);
    return { url: f.url, model: model, costUsd: price, checksum: sha256Hex_(inl.data.slice(0, 5000)).slice(0, 16) };
  }
};

function budgetGet_(ctx) {
  requireRole_(ctx, ['ADMIN', 'CREATOR', 'REVIEWER']);
  var org = Db.get('Orgs', ctx.orgId) || {};
  var usage = Db.all('AiUsage', function (u) { return u.orgId === ctx.orgId; });
  var byFeature = {};
  usage.forEach(function (u) { var f = byFeature[u.feature] = byFeature[u.feature] || { calls: 0, costUsd: 0 }; f.calls++; f.costUsd += u.costUsd; });
  var c = getSetting_('ai');
  return { dailyCapUsd: org.dailyCapUsd, episodeCapUsd: org.episodeCapUsd, killSwitch: org.killSwitch, spentTodayUsd: aiSpentToday_(ctx.orgId),
    totalUsd: usage.reduce(function (s, u) { return s + u.costUsd; }, 0), byFeature: byFeature, recent: usage.slice(-30).reverse(),
    hasKey: !!prop_('GEMINI_API_KEY'), model: c.model, imageModel: c.imageModel || 'gemini-2.5-flash-image', usdToIdr: c.usdToIdr, aiEnabled: License.status().features.ai };
}

function budgetSave_(ctx, d) {
  requireRole_(ctx, ['ADMIN']);
  var patch = {};
  if (d.dailyCapUsd !== undefined) patch.dailyCapUsd = Math.max(0, Math.min(10000, toNum_(d.dailyCapUsd)));
  if (d.episodeCapUsd !== undefined) patch.episodeCapUsd = Math.max(0, Math.min(1000, toNum_(d.episodeCapUsd)));
  if (d.killSwitch !== undefined) patch.killSwitch = !!d.killSwitch;
  Db.update('Orgs', ctx.orgId, patch);
  var keyTest = null;
  if (d.apiKey) {
    var key = normalizeApiKey_(d.apiKey);
    assert_(/^[A-Za-z0-9._\-]{20,200}$/.test(key), 'BAD_KEY', 'API key tidak dikenali (' + key.length + ' karakter setelah dibersihkan). Salin ulang dari aistudio.google.com/apikey — kunci Gemini biasanya diawali "AIza" dan panjangnya 39 karakter, tanpa spasi atau tanda kutip.');
    keyTest = testApiKey_(key);
    assert_(!keyTest.rejected, 'KEY_REJECTED', 'Google menolak API key ini: ' + keyTest.message + ' Pastikan kunci aktif dan Generative Language API diizinkan untuk kunci tersebut.');
    prop_('GEMINI_API_KEY', key);
  }
  if (d.clearKey) prop_('GEMINI_API_KEY', null);
  if (d.model || d.imageModel) { var c = getSetting_('ai'); if (d.model) c.model = clean_(d.model, 60); if (d.imageModel) c.imageModel = clean_(d.imageModel, 60); setSetting_('ai', c); }
  audit_(ctx, 'BUDGET_UPDATE', 'org', ctx.orgId, { caps: patch, keyChanged: !!(d.apiKey || d.clearKey) });
  var out = budgetGet_(ctx);
  if (keyTest) out.keyTest = keyTest;
  return out;
}

/** Bersihkan kunci yang ditempel: spasi, baris baru, tanda kutip, karakter tak terlihat, awalan "API key:" */
function normalizeApiKey_(raw) {
  var s = String(raw || '').replace(/[\u200B-\u200D\uFEFF\u00A0]/g, '')
    .replace(/^\s*(gemini[_ ]?)?api[_ ]?key\s*[:=]\s*/i, '').replace(/\s+/g, '').replace(/^["'`<(\[]+|["'`>)\].,;]+$/g, '');
  var m = s.match(/AIza[0-9A-Za-z_\-]{30,}/);
  return m ? m[0] : s;
}

/** Uji kunci ke Google (daftar model). rejected=true hanya bila Google tegas menolak kunci. */
function testApiKey_(key) {
  try {
    var res = UrlFetchApp.fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=1', { method: 'get', headers: { 'x-goog-api-key': key }, muteHttpExceptions: true });
    var code = res.getResponseCode(), msg = '';
    try { msg = (JSON.parse(res.getContentText()).error || {}).message || ''; } catch (e) { }
    if (code === 200) return { ok: true, code: code, message: 'Kunci valid dan terhubung ke Gemini API.' };
    return { ok: false, rejected: code === 400 || code === 401 || code === 403, code: code, message: msg || ('HTTP ' + code) };
  } catch (e) {
    return { ok: false, rejected: false, code: 0, message: 'Tidak bisa menghubungi Google saat ini; kunci tetap disimpan.' };
  }
}

function aiTestKey_(ctx) {
  requireRole_(ctx, ['ADMIN']);
  var key = prop_('GEMINI_API_KEY');
  assert_(key, 'NO_KEY', 'Belum ada API key tersimpan.');
  return testApiKey_(key);
}

/**
 * 10_License.gs — Lisensi & batas tier
 * Model: aktivasi online ke License Server milik penyedia (GAS Web App terpisah, lihat folder PENYEDIA).
 * Kunci terikat ke Script ID klien. Verifikasi ulang tiap 7 hari, masa tenggang offline 14 hari.
 * Catatan jujur: kode GAS dapat dibaca pemilik skrip, sehingga lisensi ini bersifat pencegahan +
 * dasar hukum (EULA), bukan DRM yang tidak bisa dibobol.
 */

var License = {
  _st: null,

  serverUrl: function () { return prop_(APP.LICENSE_SERVER_PROP) || APP.LICENSE_SERVER_DEFAULT; },

  data: function () { try { return JSON.parse(prop_('LICENSE_DATA') || 'null'); } catch (e) { return null; } },

  status: function () {
    if (this._st) return this._st;
    var cached = CacheService.getScriptCache().get('lic_status');
    if (cached) { try { this._st = JSON.parse(cached); return this._st; } catch (e) { } }
    var d = this.data(), now = new Date(), tier = 'FREE', info = {};
    if (d && d.tier && TIERS[d.tier]) {
      var expired = d.expiresAt && new Date(d.expiresAt) < now;
      var lastOk = d.checkedAt ? new Date(d.checkedAt) : new Date(0);
      var daysSince = (now - lastOk) / 86400000;
      if (daysSince > 7 && !this._verifying) this.reverify_(d);
      d = this.data() || d;
      lastOk = d.checkedAt ? new Date(d.checkedAt) : new Date(0);
      var grace = (now - lastOk) / 86400000 <= 21;
      if (!expired && d.status !== 'REVOKED' && grace) tier = d.tier;
      info = { key: this.mask_(d.key), buyer: d.buyer || '', expiresAt: d.expiresAt || '', checkedAt: d.checkedAt || '', status: expired ? 'EXPIRED' : (d.status || 'ACTIVE'), offlineGrace: !grace ? 'HABIS' : '' };
    } else {
      var started = prop_('TRIAL_STARTED') ? new Date(prop_('TRIAL_STARTED')) : now;
      var left = Math.ceil(TIERS.TRIAL.days - (now - started) / 86400000);
      if (left > 0) { tier = 'TRIAL'; info.trialDaysLeft = left; } else info.trialDaysLeft = 0;
    }
    var t = TIERS[tier];
    this._st = { tier: tier, label: t.label, limits: { series: t.series, episodes: t.episodes, users: t.users },
      features: { ai: t.ai, monetization: t.monetization, whiteLabel: t.whiteLabel, wa: t.wa }, info: info, scriptId: ScriptApp.getScriptId(), server: !!this.serverUrl() };
    CacheService.getScriptCache().put('lic_status', JSON.stringify(this._st), 300);
    return this._st;
  },

  mask_: function (k) { k = String(k || ''); return k.length > 8 ? k.slice(0, 5) + '••••' + k.slice(-4) : k; },

  post_: function (payload) {
    var url = this.serverUrl();
    assert_(url, 'NO_LICENSE_SERVER', 'URL License Server belum diatur oleh penyedia (Script Property LICENSE_SERVER_URL).');
    var res = UrlFetchApp.fetch(url, { method: 'post', contentType: 'text/plain', payload: JSON.stringify(payload), muteHttpExceptions: true, followRedirects: true });
    var j = JSON.parse(res.getContentText() || '{}');
    return j;
  },

  activate: function (key) {
    key = String(key || '').trim().toUpperCase();
    assert_(/^CINE-[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(key), 'BAD_KEY', 'Format kunci: CINE-XXXX-XXXX-XXXX-XXXX');
    var j = this.post_({ action: 'activate', key: key, scriptId: ScriptApp.getScriptId(), owner: Session.getEffectiveUser().getEmail(), app: APP.NAME, version: APP.VERSION });
    assert_(j.ok, 'LICENSE_REJECTED', (j.error && j.error.message) || 'Aktivasi ditolak server lisensi.');
    prop_('LICENSE_DATA', JSON.stringify({ key: key, tier: j.data.tier, expiresAt: j.data.expiresAt || '', buyer: j.data.buyer || '', status: 'ACTIVE', checkedAt: nowIso_(), receipt: j.data.receipt || '' }));
    this._st = null;
    CacheService.getScriptCache().remove('lic_status');
    audit_({ orgId: '', userId: 'system', email: 'license' }, 'LICENSE_ACTIVATE', 'license', this.mask_(key), { tier: j.data.tier });
    return this.status();
  },

  reverify_: function (d) {
    this._verifying = true;
    try {
      var j = this.post_({ action: 'verify', key: d.key, scriptId: ScriptApp.getScriptId(), receipt: d.receipt || '' });
      if (j.ok) { d.tier = j.data.tier; d.expiresAt = j.data.expiresAt || ''; d.status = 'ACTIVE'; d.checkedAt = nowIso_(); }
      else if (j.error && (j.error.code === 'REVOKED' || j.error.code === 'NOT_FOUND' || j.error.code === 'BOUND_OTHER')) { d.status = 'REVOKED'; d.checkedAt = nowIso_(); }
      prop_('LICENSE_DATA', JSON.stringify(d));
    } catch (e) { console.warn('verifikasi lisensi offline', e); } finally { this._verifying = false; }
  },

  checkLimit: function (kind, currentCount) {
    var st = this.status(), lim = st.limits[kind];
    assert_(lim < 0 || currentCount < lim, 'TIER_LIMIT', 'Batas tier ' + st.label + ': maksimal ' + lim + ' ' + ({ series: 'serial', episodes: 'episode', users: 'pengguna studio' }[kind] || kind) + '. Upgrade lisensi untuk menambah.');
  }
};

/**
 * 11_Admin.gs — Pengaturan & branding, unggah media ke Drive, backup, audit, notifikasi WA (Fonnte), uji sistem
 */

var SETTING_KEYS = ['branding', 'coinPackages', 'payment', 'economics', 'defaults', 'publicRegistration', 'qc', 'legal'];

function settingsGet_(ctx) {
  requireRole_(ctx, ['ADMIN']);
  var out = {};
  SETTING_KEYS.forEach(function (k) { out[k] = getSetting_(k); });

}

function settingsSave_(ctx, d) {
  requireRole_(ctx, ['ADMIN']);
  if (d.branding) {
    var b = getSetting_('branding');
    ['title', 'highlight', 'subtitle', 'badge', 'logoUrl', 'accent'].forEach(function (k) { if (d.branding[k] !== undefined) b[k] = clean_(d.branding[k], k === 'logoUrl' ? 500 : 80); });
    b.logoZoom = Math.max(0.5, Math.min(3, toNum_(d.branding.logoZoom, b.logoZoom || 1)));
    if (!/^#[0-9a-f]{6}$/i.test(b.accent)) b.accent = '#f59e0b';

  }
  if (Array.isArray(d.coinPackages)) setSetting_('coinPackages', d.coinPackages.slice(0, 8).map(function (p, i) {
    return { id: clean_(p.id, 8) || 'P' + (i + 1), coins: Math.max(1, Math.round(toNum_(p.coins))), priceIdr: Math.max(1000, Math.round(toNum_(p.priceIdr))), bonus: Math.max(0, Math.round(toNum_(p.bonus))) };
  }));

function getMediaFolder_() {

function saveToDrive_(blob) {
  var file = getMediaFolder_().createFile(blob);
  try { file.setSharing(DriveApp.Access.ANYONE_WITH_LINK, DriveApp.Permission.VIEW); } catch (e) { console.warn('sharing dibatasi domain', e); }
  var id = file.getId(), mt = blob.getContentType() || '';
  var url = /^image\//.test(mt) ? 'https://lh3.googleusercontent.com/d/' + id
    : /^video\//.test(mt) ? 'https://drive.google.com/file/d/' + id + '/preview'
      : 'https://drive.google.com/uc?export=download&id=' + id;
  return { id: id, url: url, viewUrl: file.getUrl(), size: file.getSize(), mimeType: mt };
}

var UPLOAD_RULES = { image: { re: /^image\/(png|jpe?g|webp|gif)$/, max: 5 }, audio: { re: /^audio\/(mpeg|mp3|wav|ogg|webm|aac|mp4|x-m4a)$/, max: 10 }, video: { re: /^video\/(mp4|webm|quicktime)$/, max: 25 }, doc: { re: /^application\/pdf$/, max: 5 } };

function mediaUpload_(ctx, d) {
  requireRole_(ctx);
  var kind = d.kind || 'image', rule = UPLOAD_RULES[kind];
  assert_(rule, 'BAD_KIND', 'Jenis berkas tidak didukung.');
  assert_(rule.re.test(d.mimeType || ''), 'BAD_TYPE', 'Tipe berkas ' + d.mimeType + ' tidak diizinkan untuk ' + kind + '.');
  if (ctx.role === 'VIEWER') assert_(kind === 'image' && d.purpose === 'topup-proof', 'ROLE_FORBIDDEN', 'Penonton hanya dapat mengunggah bukti transfer.');
  var raw = String(d.base64 || '').replace(/^data:[^,]+,/, '');
  assert_(raw.length > 50, 'EMPTY', 'Berkas kosong.');
  assert_(raw.length * 0.75 <= rule.max * 1024 * 1024, 'TOO_LARGE', 'Ukuran maksimal ' + rule.max + ' MB untuk ' + kind + '. Untuk video besar, unggah langsung ke Google Drive lalu tempel tautannya.');
  var name = clean_(d.name, 100).replace(/[^\w.\- ]+/g, '_') || (kind + '_' + Date.now());
  var res = saveToDrive_(Utilities.newBlob(Utilities.base64Decode(raw), d.mimeType, Date.now() + '_' + name));
  audit_(ctx, 'MEDIA_UPLOAD', 'media', res.id, { kind: kind, size: res.size, purpose: clean_(d.purpose, 40) });
  return res;
}

function getAll(reqs, single) {

  var keys = reqs.map(function (r) { r[1] = r[1] || {}; return swrKey(r[0], r[1]); });
  var cached = keys.map(cacheGet), haveAll = cached.every(function (c) { return c !== null; });
  setTimeout(function () {

  '<p>Pemberitahuan ini menjelaskan bagaimana <b>' + c.company + '</b> ("Kami"), selaku pengendali data pribadi untuk layanan <b>' + c.brand + '</b>, memproses data pribadi Anda sesuai Undang-Undang Nomor 27 Tahun 2022 tentang Pelindungan Data Pribadi (UU PDP).</p>' +
  '<h3>1. Data yang kami proses</h3><table class="t"><tr><th>Kategori</th><th>Contoh</th><th>Sumber</th></tr>' +
  '<tr><td>Akun</td><td>Nama, email, nomor WhatsApp (opsional), foto profil, password (disimpan dalam bentuk hash, tidak dapat dibaca)</td><td>Anda</td></tr>' +
  '<tr><td>Aktivitas menonton</td><td>Episode yang ditonton, persentase tontonan, suka/simpan/bagikan, ID perangkat acak untuk tamu</td><td>Pemutar</td></tr>' +
  '<tr><td>Transaksi</td><td>Paket koin, nominal, metode, foto bukti transfer, riwayat pembelian episode</td><td>Anda</td></tr>' +
  '<tr><td>Keamanan</td><td>Waktu login, jenis peramban (user agent), jejak audit tindakan</td><td>Sistem</td></tr>' +
  '<tr><td>Konten studio (khusus tim)</td><td>Naskah, gambar, audio, video, profil karakter termasuk wajah/suara aktor yang telah memberi persetujuan</td><td>Tim studio</td></tr></table>' +
  '<p>Kami tidak meminta data kartu pembayaran dan tidak memproses data biometrik penonton.</p>' +
  '<h3>2. Tujuan & dasar pemrosesan</h3><ul><li><b>Menyediakan layanan</b> (akun, pemutar, koin, riwayat) — pelaksanaan perjanjian dengan Anda.</li><li><b>Verifikasi pembayaran & pencatatan keuangan</b> — perjanjian dan kewajiban hukum.</li><li><b>Keamanan & pencegahan penyalahgunaan</b> (kunci akun, audit) — kepentingan yang sah.</li><li><b>Statistik retensi & peningkatan konten</b> dalam bentuk agregat — kepentingan yang sah.</li><li><b>Notifikasi WhatsApp</b> status top-up — persetujuan Anda dengan mengisi nomor WhatsApp; dapat dicabut dengan menghapus nomor di Profil.</li></ul>' +
  '<h3>3. Tempat penyimpanan</h3><ul><li>Google Sheets dan Google Drive milik penyelenggara (pusat data Google, dapat berada di luar Indonesia; Google menerapkan standar pelindungan setara).</li><li>Perangkat Anda (penyimpanan lokal browser): token sesi, cache tampilan, antrean offline, dan riwayat “lanjutkan menonton”. Tidak ada cookie iklan atau pelacak pihak ketiga.</li></ul>' +
  '<h3>4. Pihak yang terlibat</h3><ul><li><b>Google</b> — infrastruktur Apps Script, Sheets, Drive, dan terjemahan otomatis.</li><li><b>Google Gemini API</b> — hanya memproses konten studio (naskah, prompt) saat tim memakai fitur AI; data penonton tidak dikirim.</li><li><b>Fonnte</b> (bila diaktifkan) — pengiriman notifikasi WhatsApp: nomor dan isi pesan.</li><li><b>GitHub Pages</b> (bila dipakai) — hosting tampilan aplikasi, mencatat log akses standar.</li><li><b>Penyedia perangkat lunak CineAI Studio</b> — hanya menerima data teknis lisensi milik penyelenggara (ID proyek, email pemilik); tidak mengakses data penonton.</li></ul><p>Kami <b>tidak menjual</b> data pribadi Anda.</p>' +
  '<h3>5. Masa simpan</h3><ul><li>Data akun disimpan selama akun aktif.</li><li>Sesi login kedaluwarsa setelah 7 hari; log teknis dibersihkan otomatis dalam 30 hari.</li><li>Data transaksi disimpan sesuai kewajiban pencatatan keuangan dan perpajakan; setelah akun dihapus, data tersebut dianonimkan.</li></ul>' +
  '<h3>6. Hak Anda</h3><ul><li><b>Mengakses & mendapat salinan</b> data — menu <b>Profil → Unduh data saya</b>.</li><li><b>Memperbaiki</b> data — menu Profil.</li><li><b>Menghapus</b> akun & data — menu <b>Profil → Hapus akun</b> (akun penonton) atau hubungi kami (akun studio).</li><li><b>Menarik persetujuan</b>, <b>menolak</b> pemrosesan tertentu, dan <b>mengajukan keberatan</b> — hubungi kontak di bawah.</li></ul><p>Kami menanggapi permintaan dalam jangka waktu yang ditetapkan UU PDP.</p>' +
  '<h3>7. Keamanan</h3><p>Koneksi terenkripsi (HTTPS), password ter-hash dengan garam unik, token sesi acak, kunci akun setelah percobaan gagal, pembatasan akses berdasarkan peran, dan jejak audit. Bila terjadi kegagalan pelindungan data, kami akan memberi tahu Anda dan otoritas terkait sesuai ketentuan.</p>' +
  '<h3>8. Anak</h3><p>Layanan ditujukan untuk pengguna berusia ' + c.minAge + ' tahun ke atas. Data anak di bawah 18 tahun hanya diproses dengan persetujuan orang tua/wali.</p>' +
  '<h3>9. Perubahan & kontak</h3><p>Perubahan pemberitahuan ini diumumkan di dalam Layanan. Pertanyaan atau permintaan terkait data pribadi:<br><b>' + c.company + '</b><br>Alamat: ' + c.address + '<br>Email: ' + c.email + ' · WhatsApp: ' + c.phone + '</p>';
}
