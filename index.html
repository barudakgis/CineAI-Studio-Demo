var FLOW_ORDER = ['DRAFT', 'SCRIPT_IN_PROGRESS', 'SCRIPT_REVIEW', 'STORYBOARD_READY', 'RENDERING', 'QC_PENDING', 'PUBLISHED'];
function stLabel(s) { return (S.boot.statusLabel || {})[s] || s; }
function stChip(s) { var k = s === 'PUBLISHED' ? 'ok' : s === 'ARCHIVED' ? '' : s === 'QC_PENDING' || s === 'SCRIPT_REVIEW' ? 'warn' : s === 'DRAFT' ? '' : 'info'; return '<span class="chip ' + k + '">' + esc(stLabel(s)) + '</span>'; }

var EP_TABS = [['script', 'book', 'Naskah'], ['board', 'layers', 'Storyboard'], ['audio', 'vol', 'Audio & Subtitle'], ['qc', 'shield', 'QC & Sign-off'], ['collab', 'users', 'Kolaborasi'], ['loc', 'globe', 'Lokalisasi'], ['growth', 'trend', 'Retensi & Hook'], ['synd', 'share', 'Sindikasi']];
on('/ep/:id', function (id) {
  var tab = qp('tab') || 'script';
  skel(3);
  get('episode.workspace', { id: id }).then(function (w) {
    S.ws = w; S.curSeries = w.series; S.curChars = w.characters;
    var e = w.episode, idx = FLOW_ORDER.indexOf(e.status);
    var pipe = '<div class="pipe">' + FLOW_ORDER.map(function (s, i) { return '<div class="st ' + (i < idx ? 'done' : i === idx ? 'cur' : '') + '">' + (i < idx ? '✓ ' : '') + esc(stLabel(s)) + '</div>'; }).join('') + (e.status === 'ARCHIVED' ? '<div class="st cur">Arsip</div>' : '') + '</div>';
    var next = w.next.filter(function (n) { return n.allowed; }).map(function (n) {
      var fwd = FLOW_ORDER.indexOf(n.status) > idx;
      return '<button class="btn sm ' + (fwd && !n.blockers.length ? 'pri' : '') + '" data-act="epMove" data-s="' + n.status + '" data-b="' + esc(n.blockers.join(' • ')) + '">' + (fwd ? '→ ' : '↩ ') + esc(n.label) + (n.blockers.length ? ' ⚠' : '') + '</button>';
    }).join('');
    var head = '<div class="ws-head"><a href="#/series/' + e.seriesId + '" class="btn icon ghost">' + ic('left') + '</a><div class="ttl"><div class="tiny dim trunc">' + esc(w.series.title) + '</div><h1 style="margin:2px 0">EP ' + e.number + ' · ' + esc(e.title) + '</h1><div class="row small">' + stChip(e.status) + '<span class="dim">' + secFmt(e.durationSec) + ' · ' + (w.script ? 'naskah v' + w.script.version : 'belum ada naskah') + '</span></div></div>' +
      '<div class="acts">' + (e.status === 'PUBLISHED' ? '<a class="btn sm" href="#/w/' + e.id + '">' + ic('play') + 'Tonton</a>' : '') + (can('ADMIN,CREATOR') ? '<button class="btn sm" data-act="epForm" data-id="' + e.id + '">' + ic('edit') + '<span class="hide-m">Edit</span></button>' : '') +
      (can('ADMIN') ? '<button class="btn sm" data-act="epForce">Override</button><button class="btn sm bad icon" data-act="epDel">' + ic('trash') + '</button>' : '') + '</div></div>' + pipe +
      (next ? '<div class="row mb mt">' + next + '</div>' : '') +
      '<div class="tabs">' + EP_TABS.map(function (t) { return '<a href="#/ep/' + id + '?tab=' + t[0] + '" class="' + (tab === t[0] ? 'on' : '') + '">' + ic(t[1]) + t[2] + '</a>'; }).join('') + '</div><div id="tabBody"><div class="skel"></div></div>';
    view(head);
    (TABS[tab] || TABS.script)(w);
  }).catch(err);
});

var TABS = {};
function tb(html) { var t = $('#tabBody'); if (t) t.innerHTML = html; }

/* ===== Naskah ===== */
TABS.script = function (w) {
  var key = 'draft_' + w.episode.id, local = LS.get(key, null);
  var base = w.script ? { title: w.script.title, hook: w.script.hook, scenes: w.script.scenes } : { title: w.episode.title, hook: w.episode.hook, scenes: [] };
  S.draft = local && local.basedOn === (w.script ? w.script.version : 0) ? local.d : JSON.parse(JSON.stringify(base));
  S.draftDirty = !!(local && local.basedOn === (w.script ? w.script.version : 0));
  renderScript();
};
function editable() { var s = S.ws.episode.status; return can('ADMIN,CREATOR') && ['DRAFT', 'SCRIPT_IN_PROGRESS', 'STORYBOARD_READY'].indexOf(s) >= 0; }
function renderScript() {
  var w = S.ws, d = S.draft, ed = editable(), sc = w.script;
  var chars = w.characters.map(function (c) { return c.name; });
  var dlOpts = '<datalist id="charList">' + chars.concat(['Narator']).map(function (n) { return '<option value="' + esc(n) + '">'; }).join('') + '</datalist>';
  var val1 = sc ? '<div class="card mb ' + (sc.validation === 'INVALID' ? '' : 'hl') + '"><div class="row between"><div class="row"><b>Validasi v' + sc.version + '</b><span class="chip ' + (sc.validation === 'VALID' ? 'ok' : sc.validation === 'WARNING' ? 'warn' : 'bad') + '">' + sc.validation + '</span>' + (sc.approved ? '<span class="chip ok">Disetujui ' + esc(sc.approvedBy) + '</span>' : '') + '<span class="chip">' + esc(sc.source) + '</span></div><span class="small dim">' + sc.totalSec + ' dtk total</span></div>' +
    (sc.issues && sc.issues.length ? '<ul class="small muted" style="margin:8px 0 0;padding-left:18px">' + sc.issues.slice(0, 12).map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul>' : '') + '</div>' : '';

    (!IS_GAS ? '<a class="btn sm" href="#/connect">Ubah URL server di perangkat ini</a>' : '') + '<label class="f mt">URL License Server penyedia<input class="i" id="lsU" value="' + esc(st.licenseServer) + '" placeholder="https://script.google.com/macros/s/…/exec"></label><button class="btn sm" data-act="lsSave">Simpan URL lisensi</button></div></div>');
};
ACT.intSave = function () { var d = { adminPhone: val('ftA') }; if (val('ftT')) d.fonnteToken = val('ftT'); run(api('settings.save', d, { noQueue: true }), 'Disimpan').then(function (st) { S.set = st; SETV.int(st); }); };
ACT.waTest = function () { run(api('notify.test', { phone: val('ftA') })).then(function (r) { toast(r.sent ? 'Pesan tes terkirim ✓' : 'Gagal mengirim (cek token/lisensi)', r.sent ? 'ok' : 'bad'); }); };
ACT.waClr = function () { run(api('settings.save', { clearFonnte: true }, { noQueue: true }), 'Token dihapus').then(function (st) { SETV.int(st); }); };
ACT.lsSave = function () { run(api('settings.save', { licenseServer: val('lsU') }, { noQueue: true }), 'URL lisensi disimpan'); };

SETV.license = function (st) {
  var L = st.license, f = L.features, lim = L.limits, inf = L.info || {};
  var limTxt = function (n) { return n < 0 ? '∞' : n; };
  sb('<div class="grid g2"><div class="card col"><div class="row between"><h3 style="margin:0">' + ic('key') + 'Status lisensi</h3><span class="chip ' + (L.tier === 'FREE' ? 'warn' : 'ok') + '">' + esc(L.label) + '</span></div>' +
    '<div class="small">' + (inf.key ? 'Kunci: <span class="mono">' + esc(inf.key) + '</span><br>Pemegang: ' + esc(inf.buyer) + '<br>Berlaku s/d: ' + (inf.expiresAt ? fmtDate(inf.expiresAt) : 'selamanya') + '<br>Verifikasi terakhir: ' + fmtDate(inf.checkedAt, 1) + (inf.status !== 'ACTIVE' ? '<br><b style="color:var(--bad)">' + esc(inf.status) + '</b>' : '') : (inf.trialDaysLeft ? 'Trial tersisa <b>' + inf.trialDaysLeft + ' hari</b>.' : 'Trial berakhir — kembali ke paket Gratis.')) + '</div>' +
    '<div class="grid g3 small"><div class="card kpi"><span class="l">Serial</span><span class="v">' + limTxt(lim.series) + '</span></div><div class="card kpi"><span class="l">Episode</span><span class="v">' + limTxt(lim.episodes) + '</span></div><div class="card kpi"><span class="l">User studio</span><span class="v">' + limTxt(lim.users) + '</span></div></div>' +
    '<div class="row small">' + [['ai', 'AI Gemini'], ['monetization', 'Koin & paywall'], ['wa', 'Notifikasi WA'], ['whiteLabel', 'White-label']].map(function (x) { return '<span class="chip ' + (f[x[0]] ? 'ok' : '') + '">' + (f[x[0]] ? '✓ ' : '✗ ') + x[1] + '</span>'; }).join('') + '</div><div class="tiny dim">Script ID: <span class="mono">' + esc(L.scriptId) + '</span></div></div>' +
    '<div class="card col"><h3>Aktivasi</h3><label class="f">Kunci lisensi<input class="i mono" id="lcK" placeholder="CINE-XXXX-XXXX-XXXX-XXXX" style="text-transform:uppercase"></label><button class="btn pri" data-act="lcGo">Aktifkan</button>' + (!L.server ? '<div class="note warn small">URL License Server belum diatur (tab Integrasi). Hubungi penyedia aplikasi.</div>' : '') +
    '<div class="note small">Kunci terikat pada Script ID proyek ini. Pindah ke proyek lain? Minta penyedia melepas ikatan (rebind).</div></div></div>');
};
ACT.lcGo = function () { run(api('license.activate', { key: val('lcK') }), 'Lisensi aktif 🎉').then(function () { LS.del('boot'); boot().then(function () { go('#/settings?tab=license'); }); }); };

SETV.sys = function (st) {
  sb('<div class="grid g2"><div class="card col"><h3>Pendaftaran & QC</h3><label class="check"><input type="checkbox" id="syR"' + (st.publicRegistration !== false ? ' checked' : '') + '><span>Izinkan penonton mendaftar sendiri</span></label><div class="grid g2"><label class="f">Durasi maksimal episode (dtk)<input class="i" type="number" id="syM" value="' + st.qc.maxDurationSec + '"></label><label class="f">Skor hook minimum<input class="i" type="number" id="syH" value="' + st.qc.minHookScore + '"></label></div><button class="btn pri" data-act="sysSave">Simpan</button></div>' +
    '<div class="card col" style="grid-column:1/-1"><h3>' + ic('shield') + 'Identitas penyelenggara (dipakai di Syarat & Ketentuan dan Pemberitahuan Privasi)</h3><div class="grid g3">' +
    [['lgBrand', 'Nama layanan', 'brand'], ['lgCompany', 'Nama badan usaha / penyelenggara', 'company'], ['lgEmail', 'Email kontak', 'email'], ['lgPhone', 'WhatsApp kontak', 'phone'], ['lgCity', 'Kota (domisili hukum)', 'city'], ['lgEff', 'Tanggal berlaku', 'effective']].map(function (f) { return '<label class="f">' + f[1] + '<input class="i" id="' + f[0] + '" value="' + esc(st.legal[f[2]]) + '"></label>'; }).join('') +
    '</div><label class="f">Alamat<input class="i" id="lgAddr" value="' + esc(st.legal.address) + '"></label><div class="row"><label class="f" style="width:160px">Usia minimal<input class="i" type="number" id="lgAge" value="' + st.legal.minAge + '"></label><button class="btn pri" data-act="legalSave" style="align-self:flex-end">Simpan identitas</button><a class="btn" href="#/terms" style="align-self:flex-end">Lihat S&K</a><a class="btn" href="#/privacy" style="align-self:flex-end">Lihat Privasi</a></div><div class="tiny dim">Template ini disusun mengacu UU PDP & praktik umum layanan digital; bukan nasihat hukum — mintakan tinjauan konsultan hukum sebelum dipakai komersial.</div></div>' +
    '<div class="card col"><h3>Backup</h3><p class="small muted">Ekspor seluruh tabel (tanpa hash password & sesi) ke berkas JSON di folder Drive “CineAI Studio - Media”. Google Sheet sendiri juga punya riwayat versi (File → Riwayat versi).</p><button class="btn" data-act="bkGo">' + ic('down') + 'Backup ke Drive</button><div id="bkOut"></div>' +
    '<h3 class="mt">Cache perangkat</h3><p class="small muted">Antrean offline: ' + S.outbox.length + ' aksi.</p><div class="row"><button class="btn" data-act="clearCache">Hapus cache</button>' + (S.outbox.length ? '<button class="btn bad" data-act="clearQueue">Buang antrean</button>' : '') + '</div></div></div>');
};
ACT.legalSave = function () { run(api('settings.save', { legal: { brand: val('lgBrand'), company: val('lgCompany'), email: val('lgEmail'), phone: val('lgPhone'), city: val('lgCity'), effective: val('lgEff'), address: val('lgAddr'), minAge: num('lgAge') } }, { noQueue: true }), 'Identitas legal disimpan').then(function () { LS.del('boot'); boot(); }); };
ACT.sysSave = function () { run(api('settings.save', { publicRegistration: val('syR'), qc: { maxDurationSec: num('syM'), minHookScore: num('syH') } }, { noQueue: true }), 'Disimpan'); };
ACT.bkGo = function () { run(api('backup.export', {})).then(function (r) { $('#bkOut').innerHTML = '<div class="note small">' + r.tables.map(function (t) { return esc(t.name) + ': ' + t.rows; }).join(' · ') + '<br><a href="' + esc(r.driveUrl) + '" target="_blank" rel="noopener">Buka berkas backup</a></div>'; }); };
ACT.clearQueue = function () { confirmBox('Buang ' + S.outbox.length + ' aksi yang belum terkirim?').then(function (y) { if (y) { S.outbox = []; LS.set('outbox', []); renderNet(); route(); } }); };

on('/tests', function () {
  view(pageHead('Uji sistem', 'Uji otomatis server (hash, sesi, pemecahan sel 50rb, mesin status, RBAC, validasi, lisensi)', '<button class="btn pri" data-act="tsGo">' + ic('play') + 'Jalankan</button>') + '<div id="tsOut"></div>');
  ACT.tsGo();
});
ACT.tsGo = function () {
  var o = $('#tsOut'); if (o) o.innerHTML = '<div class="skel"></div>';
  api('tests.run', {}).then(function (r) {
    $('#tsOut').innerHTML = '<div class="card mb row between"><b>' + r.passed + '/' + r.total + ' lulus</b><span class="chip ' + (r.passed === r.total ? 'ok' : 'bad') + '">' + (r.passed === r.total ? 'SEMUA LULUS' : 'ADA YANG GAGAL') + '</span></div><div class="card pad0">' + r.items.map(function (i) { return '<div class="chk"><span class="ic ' + (i.ok ? 'PASSED' : 'FAILED') + '">' + (i.ok ? '✓' : '✗') + '</span><div class="grow small"><b>' + esc(i.name) + '</b>' + (i.msg ? '<div class="tiny" style="color:var(--bad)">' + esc(i.msg) + '</div>' : '') + '</div><span class="tiny dim">' + i.ms + ' ms</span></div>'; }).join('') + '</div>' +
      '<div class="card mt small"><b>Klien:</b> mode ' + (IS_GAS ? 'Apps Script' : 'PWA') + ' · ' + (S.online ? 'online' : 'offline') + ' · antrean ' + S.outbox.length + ' · SW ' + ('serviceWorker' in navigator && navigator.serviceWorker.controller ? 'aktif' : 'tidak aktif') + ' · localStorage ' + (function () { try { localStorage.setItem('t', '1'); localStorage.removeItem('t'); return 'OK'; } catch (e) { return 'diblokir'; } })() + '</div>';
  }).catch(err);
};

/* ---------------- init + PWA ---------------- */
var deferredPrompt = null;
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferredPrompt = e; var t = $('.top'); if (t && !$('#instBtn')) t.insertAdjacentHTML('beforeend', '<button id="instBtn" class="btn sm" data-act="install">' + ic('down') + '<span class="hide-m">Pasang</span></button>'); });
ACT.install = function () { if (!deferredPrompt) return toast('Gunakan menu browser → Tambahkan ke layar utama'); deferredPrompt.prompt(); deferredPrompt.userChoice.then(function () { deferredPrompt = null; var b = $('#instBtn'); if (b) b.remove(); }); };
if (!IS_GAS && !IS_DEMO && 'serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').then(function (reg) {
      reg.addEventListener('updatefound', function () { var nw = reg.installing; nw && nw.addEventListener('statechange', function () { if (nw.state === 'installed' && navigator.serviceWorker.controller) toast('Versi baru tersedia — muat ulang halaman untuk memperbarui'); }); });
    }).catch(function (e) { console.warn('SW gagal', e); });
  });
}
window.addEventListener('error', function (e) { if (e && e.message && !/ResizeObserver|Script error/.test(e.message)) console.error('[CineAI]', e.message); });
boot();

/* DEMO: di dalam bingkai (mis. halaman berbagi), unduhan diganti jendela salin */
if (window.self !== window.top) {
  dl = function (name, text) { S.dlText = String(text); modal('Unduh ' + esc(name), '<p class="small muted" style="margin-top:0">Unduhan berkas tidak tersedia di tampilan ini. Salin isinya:</p><textarea class="i mono" style="min-height:240px;font-size:12px">' + esc(S.dlText.slice(0, 200000)) + '</textarea>', '<button class="btn pri" data-act="copyDl">Salin</button>'); };
  ACT.copyDl = function () { copy(S.dlText || ''); };
}
</script>
</body>
</html>
