<!doctype html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CineAI Studio Demo</title>
<meta name="description" content="Studio produksi & pemutar drama vertikal 9:16 berbasis Google Sheets — naskah, storyboard, subtitle, QC, koin & royalti.">
<meta name="theme-color" content="#0b0a09">
<meta name="robots" content="noindex">
<style>
:root{
  color-scheme:dark;
  --bg:#0b0a09;--bg2:#13110f;--card:#1a1714;--card2:#221e1a;--line:#2e2924;--line2:#3b342d;
  --tx:#f3eee7;--tx2:#b9afa3;--tx3:#857b70;--acc:#f59e0b;--acc2:#fbbf24;--accTx:#1a1206;
  --ok:#34d399;--warn:#fbbf24;--bad:#f87171;--info:#60a5fa;--vio:#a78bfa;
  --r:14px;--r2:10px;--sh:0 10px 30px rgba(0,0,0,.45);
  --safeB:env(safe-area-inset-bottom,0px);--safeT:env(safe-area-inset-top,0px);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
:root[data-theme="light"]{color-scheme:light;--bg:#f6f3ee;--bg2:#eee9e1;--card:#fff;--card2:#f7f3ed;--line:#e3dbd0;--line2:#d4c9bb;--tx:#1d1914;--tx2:#5a5148;--tx3:#8a8076;--sh:0 8px 24px rgba(60,40,10,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--font);font-size:15px;line-height:1.45}
body{min-height:100vh;overflow-x:hidden}
a{color:var(--acc2)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0 0 .4em;line-height:1.2;letter-spacing:-.01em}
h1{font-size:1.5rem}h2{font-size:1.22rem}h3{font-size:1.05rem}
.ico{flex:0 0 auto}.empty .ico{width:40px;height:40px}
.muted{color:var(--tx2)}.dim{color:var(--tx3)}.small{font-size:.82rem}.tiny{font-size:.72rem}.mono{font-family:var(--mono)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.nw{flex-wrap:nowrap}.grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:10px}
.between{justify-content:space-between}.end{justify-content:flex-end}.center{justify-content:center}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}.gcards{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.mt{margin-top:12px}.mt2{margin-top:20px}.mb{margin-bottom:12px}
.hide{display:none!important}.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- shell ---------- */
.app{display:flex;min-height:100vh}
.side{width:236px;flex:0 0 236px;background:var(--bg2);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;padding:14px 10px 20px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(10px + var(--safeT)) 16px 10px;display:flex;align-items:center;gap:10px}
.content{padding:18px 16px 110px;max-width:1240px;width:100%;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--acc),#b45309);display:grid;place-items:center;overflow:hidden;flex:0 0 auto;box-shadow:0 0 0 1px rgba(255,255,255,.08) inset}
.logo img{width:100%;height:100%;object-fit:cover;transform:scale(var(--lz,1));transition:transform .25s}
.logo svg{width:22px;height:22px;color:var(--accTx)}
.brand-t{font-weight:900;letter-spacing:.06em;font-size:1rem;line-height:1}.brand-t b{color:var(--acc)}
.brand-s{font-size:.68rem;color:var(--tx3);margin-top:3px;letter-spacing:.02em}
.badge{font-size:.62rem;font-weight:800;letter-spacing:.06em;padding:3px 7px;border-radius:99px;background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc2);border:1px solid color-mix(in srgb,var(--acc) 35%,transparent)}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:16px}
.nav .sec{font-size:.66rem;letter-spacing:.12em;color:var(--tx3);margin:14px 10px 6px;font-weight:700;text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--tx2);text-decoration:none;font-weight:600;font-size:.9rem}
.nav a:hover{background:var(--card);color:var(--tx)}
.nav a.on{background:var(--card2);color:var(--acc2);box-shadow:0 0 0 1px var(--line2) inset}
.nav a svg,.bnav a svg{width:18px;height:18px;flex:0 0 auto}
.nav .cnt{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:.66rem;padding:1px 6px}
.bnav{display:none}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--card2);display:grid;place-items:center;overflow:hidden;font-weight:800;font-size:.8rem;color:var(--acc2);flex:0 0 auto;border:1px solid var(--line2);cursor:zoom-in}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.lg{width:84px;height:84px;font-size:1.5rem}
.net{font-size:.7rem;padding:3px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--tx2);white-space:nowrap}
.net.off{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.net.q{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}

/* ---------- komponen ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card.pad0{padding:0;overflow:hidden}.card.hl{border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
.card h3{display:flex;align-items:center;gap:8px}
.kpi{display:flex;flex-direction:column;gap:2px}.kpi .v{font-size:1.55rem;font-weight:850;letter-spacing:-.02em}.kpi .l{font-size:.74rem;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:8px 14px;border-radius:11px;border:1px solid var(--line2);background:var(--card2);color:var(--tx);font-weight:700;font-size:.88rem;cursor:pointer;white-space:nowrap;text-decoration:none;transition:transform .08s,background .15s}
.btn:active{transform:scale(.97)}.btn:hover{background:var(--line)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accTx)}.btn.pri:hover{background:var(--acc2)}
.btn.ghost{background:transparent}.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line2))}
.btn.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--line2))}
.btn.sm{min-height:32px;padding:5px 10px;font-size:.8rem;border-radius:9px}
.btn.icon{width:40px;padding:0}.btn.sm.icon{width:32px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:16px;height:16px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;font-weight:800;letter-spacing:.04em;padding:3px 8px;border-radius:99px;background:var(--card2);border:1px solid var(--line2);color:var(--tx2);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.chip.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.chip.info{color:var(--info);border-color:color-mix(in srgb,var(--info) 35%,transparent);background:color-mix(in srgb,var(--info) 10%,transparent)}
.chip.vio{color:var(--vio);border-color:color-mix(in srgb,var(--vio) 35%,transparent);background:color-mix(in srgb,var(--vio) 10%,transparent)}
.chip.acc{color:var(--acc2);border-color:color-mix(in srgb,var(--acc) 40%,transparent);background:color-mix(in srgb,var(--acc) 12%,transparent)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.78rem;font-weight:700;color:var(--tx2)}
input.i,select.i,textarea.i{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-size:16px;outline:none;min-height:42px}
textarea.i{min-height:84px;resize:vertical;line-height:1.4}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc)}
input[type=range]{accent-color:var(--acc);width:100%}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:.9rem;cursor:pointer}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin:0 -16px 14px;padding:0 16px}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:10px 12px;font-weight:700;font-size:.86rem;color:var(--tx3);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs a.on{color:var(--acc2);border-color:var(--acc)}
.tabs a svg{width:15px;height:15px}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}.li.click{cursor:pointer}.li.click:hover{background:var(--card2)}
.empty{padding:34px 16px;text-align:center;color:var(--tx3)}
.empty svg{opacity:.5;margin-bottom:8px}
table.t{width:100%;border-collapse:collapse;font-size:.86rem}
table.t th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--tx3);padding:8px 10px;border-bottom:1px solid var(--line)}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
.bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px}
.note{padding:10px 12px;border-radius:10px;background:var(--card2);border:1px dashed var(--line2);font-size:.84rem;color:var(--tx2)}
.note.warn{border-color:color-mix(in srgb,var(--warn) 50%,transparent);background:color-mix(in srgb,var(--warn) 8%,transparent)}
.note.bad{border-color:color-mix(in srgb,var(--bad) 50%,transparent);background:color-mix(in srgb,var(--bad) 8%,transparent)}
.code{font-family:var(--mono);font-size:.76rem;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px;white-space:pre-wrap;word-break:break-all;max-height:260px;overflow:auto}
hr.s{border:0;border-top:1px solid var(--line);margin:14px 0}

/* ---------- serial/episode ---------- */
.cover{aspect-ratio:9/16;border-radius:12px;overflow:hidden;position:relative;background:#222;display:flex;align-items:flex-end}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover .ov{position:relative;padding:10px;width:100%;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff}
.cover .ov b{display:block;font-size:.92rem;line-height:1.2}
.cover .tagx{position:absolute;top:8px;left:8px}
.gen-cover{position:absolute;inset:0}
.pipe{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:2px 0 6px}
.pipe .st{flex:1 0 auto;min-width:86px;font-size:.66rem;font-weight:800;letter-spacing:.03em;text-align:center;padding:6px 6px;border-radius:8px;background:var(--card2);color:var(--tx3);border:1px solid var(--line)}
.pipe .st.done{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.pipe .st.cur{background:var(--acc);color:var(--accTx);border-color:var(--acc)}
.scene{border:1px solid var(--line2);border-radius:12px;padding:12px;background:var(--bg2)}
.scene+.scene{margin-top:12px}
.subrow{display:grid;grid-template-columns:110px 1fr 1fr 70px 34px;gap:6px;align-items:start;margin-top:6px}
.dlgrow{display:grid;grid-template-columns:120px 100px 1fr 64px 34px;gap:6px;align-items:start;margin-top:6px}
.frames{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.frame{background:var(--bg2);border:1px solid var(--line2);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.frame .img{aspect-ratio:9/16;background:repeating-linear-gradient(135deg,#1c1916,#1c1916 10px,#181512 10px,#181512 20px);position:relative;display:flex;align-items:center;justify-content:center;padding:10px;text-align:center;cursor:zoom-in}
.frame .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame .img .p{font-size:.66rem;color:var(--tx3);display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden}
.frame .meta{padding:8px 10px;display:flex;flex-direction:column;gap:6px;font-size:.78rem}
.ring{width:96px;height:96px}
.chk{display:flex;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}.chk:first-child{border-top:0}
.chk .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:900;flex:0 0 auto}
.ic.PASSED{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}.ic.WARNING{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}.ic.FAILED{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}
.cmt{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.cmt:first-child{border-top:0}.cmt.res{opacity:.55}
.ts{font-family:var(--mono);font-size:.72rem;background:var(--card2);padding:2px 6px;border-radius:6px;color:var(--acc2);border:1px solid var(--line2)}

/* ---------- pemutar 9:16 ---------- */
.watch-wrap{display:flex;gap:18px;align-items:flex-start;justify-content:center}
.player{position:relative;width:min(420px,100%);aspect-ratio:9/16;max-height:calc(100vh - 120px);background:#000;border-radius:18px;overflow:hidden;box-shadow:var(--sh);touch-action:pan-x}
.player video,.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover;background:#000}
.player .poster{position:absolute;inset:0}
.p-top{position:absolute;top:0;left:0;right:0;padding:12px;background:linear-gradient(rgba(0,0,0,.7),transparent);color:#fff;z-index:3;display:flex;gap:8px;align-items:center}
.p-side{position:absolute;right:8px;bottom:110px;display:flex;flex-direction:column;gap:14px;z-index:4}
.p-side button{width:46px;height:46px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(6px)}
.p-side button.on{color:#fb7185}.p-side button.on2{color:var(--acc2)}
.p-side small{display:block;font-size:.62rem;color:#fff;text-align:center;margin-top:2px;text-shadow:0 1px 2px #000}
.p-side svg{width:22px;height:22px}
.p-bot{position:absolute;left:0;right:0;bottom:0;padding:14px 64px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff;z-index:3}
.p-sub{position:absolute;left:6%;right:64px;bottom:26%;text-align:center;z-index:3;pointer-events:none}
.p-sub span{display:inline;background:rgba(0,0,0,.62);color:#fff;font-weight:700;font-size:1rem;line-height:1.5;padding:2px 8px;border-radius:6px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.p-lock{position:absolute;inset:0;z-index:6;background:rgba(10,8,6,.86);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:22px;text-align:center;color:#fff}
.p-hook{position:absolute;left:12px;right:12px;bottom:120px;z-index:5;background:rgba(0,0,0,.78);border:1px solid var(--acc);border-radius:14px;padding:14px;color:#fff;animation:pop .35s ease}
.p-prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.18);z-index:4}.p-prog i{display:block;height:100%;background:var(--acc)}
@keyframes pop{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.ep-pills{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.ep-pill{aspect-ratio:1;border-radius:10px;background:var(--card2);border:1px solid var(--line2);display:grid;place-items:center;font-weight:800;cursor:pointer;position:relative}
.ep-pill.on{background:var(--acc);color:var(--accTx)}.ep-pill.lock::after{content:"🔒";position:absolute;top:2px;right:3px;font-size:.6rem}
.coin{display:inline-flex;align-items:center;gap:4px;font-weight:800;color:var(--acc2)}
.pkg{border:1px solid var(--line2);border-radius:12px;padding:12px;text-align:center;cursor:pointer;background:var(--bg2)}
.pkg.on{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 35%,transparent)}
.pkg b{font-size:1.25rem;display:block}

/* ---------- overlay ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
.modal{background:var(--card);border:1px solid var(--line2);border-radius:18px;width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:var(--sh)}
.modal.wide{width:min(920px,100%)}
.modal .mh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}
.modal .mb{padding:16px}.modal .mf{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--card)}
.lightbox{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden}
.lightbox img{max-width:94vw;max-height:86vh;transition:transform .1s;transform-origin:center;user-select:none;-webkit-user-drag:none}
.lightbox .lb-tools{position:absolute;bottom:calc(18px + var(--safeB));left:50%;transform:translateX(-50%);display:flex;gap:8px}
.lightbox .lb-x{position:absolute;top:calc(14px + var(--safeT));right:14px}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safeB));transform:translateX(-50%);z-index:99;background:var(--card2);border:1px solid var(--line2);padding:11px 16px;border-radius:12px;box-shadow:var(--sh);font-weight:600;font-size:.88rem;max-width:calc(100vw - 32px);animation:pop .2s}
.toast.bad{border-color:var(--bad);color:#fecaca}.toast.ok{border-color:var(--ok)}
.loader{position:fixed;top:0;left:0;right:0;height:3px;z-index:100;overflow:hidden}.loader i{display:block;height:100%;width:40%;background:var(--acc);animation:ld 1s infinite ease-in-out}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@keyframes fade{from{opacity:0}}
.skel{background:linear-gradient(90deg,var(--card) 0,var(--card2) 50%,var(--card) 100%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:12px;min-height:80px}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- login ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.auth-art{position:relative;overflow:hidden;background:radial-gradient(1200px 600px at 20% 10%,color-mix(in srgb,var(--acc) 30%,transparent),transparent 60%),#0a0807;display:flex;flex-direction:column;justify-content:flex-end;padding:40px}
.strip{position:absolute;inset:-20% -10%;display:flex;gap:14px;transform:rotate(-12deg);opacity:.55}
.strip .c{flex:0 0 120px;display:flex;flex-direction:column;gap:14px;animation:roll 40s linear infinite}
.strip .c:nth-child(2n){animation-direction:reverse;animation-duration:52s}
.strip .fr{aspect-ratio:9/16;border-radius:12px;border:1px solid rgba(255,255,255,.08)}
@keyframes roll{to{transform:translateY(-50%)}}
.auth-form{display:flex;align-items:center;justify-content:center;padding:24px 16px}
.auth-box{width:min(400px,100%)}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;padding:9px;border-radius:9px;font-weight:700;color:var(--tx3);cursor:pointer}
.seg button.on{background:var(--card2);color:var(--tx);box-shadow:0 0 0 1px var(--line2)}

/* ---------- responsif ---------- */
@media (max-width:1024px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
  .side{display:none}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--bg2) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--safeB))}
  .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:.64rem;font-weight:700;color:var(--tx3);text-decoration:none;border-radius:10px;position:relative}
  .bnav a.on{color:var(--acc2)}
  .bnav .cnt{position:absolute;top:2px;right:22%;background:var(--bad);color:#fff;border-radius:99px;font-size:.58rem;padding:0 5px}
  .auth{grid-template-columns:1fr}.auth-art{min-height:170px;padding:20px 16px}
  .watch-wrap{flex-direction:column;align-items:center}
  .content{padding:14px 16px 110px}
}
@media (max-width:640px){
  .g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}
  .g2.keep,.keep2,.g4.keep{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gcards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .subrow,.dlgrow{grid-template-columns:1fr 1fr;}
  .subrow>:nth-child(2),.subrow>:nth-child(3),.dlgrow>:nth-child(3){grid-column:1/-1}
  .frames{grid-template-columns:repeat(2,minmax(0,1fr))}
  .modal-bg{padding:0;align-items:flex-end}
  .modal{border-radius:18px 18px 0 0;max-height:92vh}
  .hide-m{display:none!important}
  h1{font-size:1.3rem}
  .kpi .v{font-size:1.3rem}
  .player{width:100%;max-height:calc(100vh - 150px);border-radius:14px}
  table.t.resp thead{display:none}
  table.t.resp tr{display:block;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:6px 4px}
  table.t.resp td{display:flex;justify-content:space-between;gap:12px;border:0;padding:5px 10px}
  table.t.resp td::before{content:attr(data-l);font-size:.72rem;color:var(--tx3);font-weight:700;text-transform:uppercase}
}
@media (min-width:821px){.only-m{display:none!important}}
@media print{.side,.bnav,.top,.btn{display:none!important}.content{padding:0}body{background:#fff;color:#000}}

.ws-head{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;margin-bottom:12px}.ws-head .ttl{flex:1 1 260px;min-width:0}.ws-head .acts{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:640px){.ws-head .acts{width:100%}.ws-head h1{font-size:1.15rem}}
.player.hasv .p-bot{bottom:58px;background:linear-gradient(transparent,rgba(0,0,0,.6));padding-bottom:6px}.player.hasv .p-side{bottom:170px}
.legal h3{margin:18px 0 6px;color:var(--acc2)}.legal p,.legal li{font-size:.9rem;color:var(--tx2)}.legal ul{padding-left:20px}.legal table{margin:8px 0}
@media print{.legal h3{color:#92400e}.legal p,.legal li{color:#222}}

#demoBar{position:fixed;top:calc(8px + var(--safeT));left:50%;transform:translateX(-50%);z-index:60;background:rgba(245,158,11,.95);color:#1a1206;border-radius:99px;padding:4px 6px 4px 12px;font-size:.72rem;display:flex;align-items:center;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.4);white-space:nowrap}#demoBar .btn{min-height:24px;padding:2px 8px;font-size:.68rem;background:#1a1206;color:#fbbf24;border-color:#1a1206}@media (max-width:820px){#demoBar{top:auto;bottom:calc(70px + var(--safeB))}}

</style>

  migrate: false,

  /** Ambil sheet (dibuat bila belum ada). Cek migrasi kolom hanya saat setup / sekali per versi aplikasi. */
  sheet: function (name) {
    if (this._sh[name]) return this._sh[name];
    var ss = this.ss();
    var sh = ss.getSheetByName(name);
    if (!sh) {
      sh = ss.insertSheet(name);
      var cols = SCHEMA[name];
      sh.getRange(1, 1, 1, cols.length).setValues([cols]).setFontWeight('bold').setBackground('#111827').setFontColor('#fbbf24');
      sh.setFrozenRows(1);
      sh.getRange(1, 1, sh.getMaxRows(), cols.length).setNumberFormat('@');
    } else if (this.migrate || this._needMigrate(name)) {
      var want = SCHEMA[name];
      var lastCol = Math.max(sh.getLastColumn(), 1);
      var have = sh.getRange(1, 1, 1, lastCol).getValues()[0];
      if (have.length < want.length && have.join('|') === want.slice(0, have.length).join('|')) {
        var add = want.slice(have.length);
        sh.getRange(1, have.length + 1, 1, add.length).setValues([add]).setFontWeight('bold');
        sh.getRange(1, have.length + 1, sh.getMaxRows(), add.length).setNumberFormat('@');
      }
      CacheService.getScriptCache().put('M:' + APP.VERSION + ':' + name, '1', 21600);
    }
    this._sh[name] = sh;
    return sh;
  },

  _mig: null,
  _needMigrate: function (name) {
    if (!this._mig) {
      var keys = Object.keys(SCHEMA).map(function (n) { return 'M:' + APP.VERSION + ':' + n; });
      this._mig = CacheService.getScriptCache().getAll(keys) || {};
    }
    return !this._mig['M:' + APP.VERSION + ':' + name];
  },

  /* ---------- cache antar-permintaan (CacheService) dengan nomor versi per tabel ---------- */
  _vers: null,
  _dirty: {},
  CHUNK: 90000,
  MAX_CACHE: 2000000,

  _ver: function (name) {
    var c = CacheService.getScriptCache();
    if (!this._vers) this._vers = c.getAll(Object.keys(SCHEMA).map(function (n) { return 'V:' + n; })) || {};
    var v = this._vers['V:' + name];
    if (!v) { v = 'v' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); this._vers['V:' + name] = v; c.put('V:' + name, v, 21600); }
    return v;
  },

  /** Nilai mentah baris data (tanpa header). Dibaca dari cache bila versi tabel belum berubah. */
  _raw: function (name) {
    var cols = SCHEMA[name].length, c = CacheService.getScriptCache(), dirty = this._dirty[name];
    if (!dirty) {
      var base = 'D:' + name + ':' + this._ver(name), meta = c.get(base);
      if (meta !== null) {
        var n = Number(meta), keys = [], i;
        if (n === 0) return [];
        for (i = 0; i < n; i++) keys.push(base + ':' + i);
        var got = c.getAll(keys), str = '';
        for (i = 0; i < n; i++) { if (got[keys[i]] === undefined || got[keys[i]] === null) { str = null; break; } str += got[keys[i]]; }
        if (str !== null) { try { return JSON.parse(str); } catch (e) { /* baca ulang dari sheet */ } }
      }
    }
    var sh = this.sheet(name), last = sh.getLastRow();
    var vals = last >= 2 ? sh.getRange(2, 1, last - 1, cols).getValues() : [];
    for (var r = 0; r < vals.length; r++) for (var k = 0; k < cols; k++) if (vals[r][k] instanceof Date) vals[r][k] = vals[r][k].toISOString();
    if (!dirty) {
      try {
        var json = JSON.stringify(vals);
        if (json.length <= this.MAX_CACHE) {
          var put = {}, b = 'D:' + name + ':' + this._ver(name), cnt = Math.ceil(json.length / this.CHUNK);
          for (var j = 0; j < cnt; j++) put[b + ':' + j] = json.slice(j * this.CHUNK, (j + 1) * this.CHUNK);
          put[b] = String(json.length ? cnt : 0);
          c.putAll(put, 21600);
        }
      } catch (e) { /* cache penuh: abaikan */ }
    }
    return vals;
  },

  /** Tandai tabel berubah (cache tidak dipakai sampai commit) */
  _touch: function (name) { this._dirty[name] = true; delete this._memo[name]; },

  /** Simpan perubahan ke Sheets lalu naikkan versi cache tabel yang berubah. Dipanggil di akhir tiap permintaan. */
  commit: function () {
    var names = Object.keys(this._dirty);
    if (!names.length) return;
    SpreadsheetApp.flush();
    var put = {};
    names.forEach(function (n) { put['V:' + n] = 'v' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); });
    CacheService.getScriptCache().putAll(put, 21600);
    if (this._vers) for (var k in put) this._vers[k] = put[k];
    this._dirty = {};
  },

  /** Baca n baris terakhir langsung (untuk log yang terus bertambah, mis. Audit) */
  tail: function (name, n) {
    var sh = this.sheet(name), last = sh.getLastRow(), cols = SCHEMA[name].length;
    if (last < 2) return [];
    var start = Math.max(2, last - n + 1);
    return this._decode(name, sh.getRange(start, 1, last - start + 1, cols).getValues(), start).list.map(function (o) { return Db._strip(o); });
  },

  _decodeCell: function (col, v, isJson) {
    if (v instanceof Date) return v.toISOString();
    if (typeof v === 'string' && v.indexOf(APP.BLOB_PREFIX) === 0) v = Blob_.get(v.slice(APP.BLOB_PREFIX.length));
    if (isJson) return v === null || v === undefined ? '' : String(v);
    if (NUM_COLS.indexOf(col) >= 0) return v === '' ? 0 : toNum_(v, 0);
    if (BOOL_COLS.indexOf(col) >= 0) return toBool_(v);
    return v === null || v === undefined ? '' : String(v);
  },

  _rows: function (name) {
    if (this._memo[name]) return this._memo[name];
    var out = this._decode(name, this._raw(name), 2);
    this._memo[name] = out;
    return out;
  },

  _decode: function (name, values, startRow) {
    var cols = SCHEMA[name], jcols = JSON_COLS[name] || [];
    var out = { list: [], index: {} };
    for (var r = 0; r < values.length; r++) {
      if (values[r][0] === '' || values[r][0] === null) continue;
      var o = {};
      for (var c = 0; c < cols.length; c++) {
        var isJ = jcols.indexOf(cols[c]) >= 0;
        var val = this._decodeCell(cols[c], values[r][c], isJ);
        if (isJ) { try { val = val === '' ? null : JSON.parse(val); } catch (e) { /* biarkan string */ } }
        o[cols[c]] = val;
      }
      o._row = r + startRow;
      out.index[String(o[cols[0]])] = out.list.length;
      out.list.push(o);
    }
    return out;
  },

  all: function (name, filterFn) {
    var list = this._rows(name).list.map(function (o) { return Db._strip(o); });
    return filterFn ? list.filter(filterFn) : list;
  },

  get: function (name, id) {
    var t = this._rows(name), i = t.index[String(id)];
    return i === undefined ? null : this._strip(t.list[i]);
  },

  _strip: function (o) {
    var c = {};
    for (var k in o) if (k !== '_row') c[k] = o[k];
    return c;
  },

  _encodeRow: function (name, obj) {
    var cols = SCHEMA[name], jcols = JSON_COLS[name] || [], key = obj[cols[0]];
    return cols.map(function (col) {
      var v = obj[col];
      if (v === undefined || v === null) return '';
      if (jcols.indexOf(col) >= 0 && typeof v !== 'string') v = JSON.stringify(v);
      if (typeof v === 'boolean') return v ? 'TRUE' : 'FALSE';
      v = String(v);
      if (v.length > APP.CELL_LIMIT) {
        var bkey = name + ':' + key + ':' + col;
        Blob_.put(bkey, v);
        return APP.BLOB_PREFIX + bkey;
      }
      return safeCell_(v);
    });
  },

  insert: function (name, obj) {
    var cols = SCHEMA[name];
    if (!obj[cols[0]]) obj[cols[0]] = uid_(name.slice(0, 3).toLowerCase());
    var sh = this.sheet(name);
    var row = this._encodeRow(name, obj);
    sh.appendRow(row);
    this._touch(name);
    return this._strip(obj);
  },

  insertMany: function (name, objs) {
    if (!objs.length) return [];
    var cols = SCHEMA[name], self = this;
    var rows = objs.map(function (o) { if (!o[cols[0]]) o[cols[0]] = uid_(name.slice(0, 3).toLowerCase()); return self._encodeRow(name, o); });
    var sh = this.sheet(name);
    var start = sh.getLastRow() + 1;
    sh.getRange(start, 1, rows.length, cols.length).setNumberFormat('@').setValues(rows);
    this._touch(name);
    return objs;
  },

  update: function (name, id, patch) {
    var t = this._rows(name), i = t.index[String(id)];
    if (i === undefined) return null;
    var cur = t.list[i], merged = {};
    for (var k in cur) merged[k] = cur[k];
    for (var p in patch) if (p !== '_row' && p !== SCHEMA[name][0]) merged[p] = patch[p];
    // Hapus blob lama untuk kolom yang ikut diubah
    for (var col in patch) Blob_.remove(name + ':' + id + ':' + col);
    var row = this._encodeRow(name, merged);
    this.sheet(name).getRange(cur._row, 1, 1, row.length).setValues([row]);
    this._touch(name);
    return this._strip(merged);
  },

  upsert: function (name, id, obj) {
    obj[SCHEMA[name][0]] = id;
    return this.get(name, id) ? this.update(name, id, obj) : this.insert(name, obj);
  },

  remove: function (name, id) {
    var t = this._rows(name), i = t.index[String(id)];
    if (i === undefined) return false;
    var cols = SCHEMA[name];
    cols.forEach(function (c) { Blob_.remove(name + ':' + id + ':' + c); });
    this.sheet(name).deleteRow(t.list[i]._row);
    this._touch(name);
    return true;
  },

  removeWhere: function (name, fn) {
    var t = this._rows(name), sh = this.sheet(name), rows = [];
    t.list.forEach(function (o) { if (fn(o)) rows.push(o._row); });
    rows.sort(function (a, b) { return b - a; }).forEach(function (r) { sh.deleteRow(r); });
    if (rows.length) this._touch(name);
    return rows.length;
  },

  withLock: function (fn) {
    var lock = LockService.getScriptLock();
    lock.waitLock(20000);
    try { return fn(); } finally { lock.releaseLock(); }
  },

  reset: function () { try { this.commit(); } catch (e) { } this._memo = {}; this._dirty = {}; this._vers = null; this._mig = null; Blob_._memo = null; }
};

/** Cegah formula injection (=, +, -, @ di awal). Apostrof = prefiks teks Sheets, tidak ikut terbaca kembali. */
function safeCell_(v) { return /^[=+\-@']/.test(v) ? "'" + v : v; }

/** Penyimpanan potongan teks panjang (> 45rb karakter) */
var Blob_ = {
  _memo: null,
  _load: function () {
    if (this._memo) return this._memo;
    var m = {};
    Db._raw('_Blobs').forEach(function (r) {
      if (!r[0]) return;
      (m[r[0]] = m[r[0]] || [])[Number(r[1])] = String(r[2]);
    });
    this._memo = m;
    return m;
  },
  get: function (key) {
    var parts = this._load()[key];
    return parts ? parts.join('') : '';
  },
  put: function (key, text) {
    this.remove(key);
    var rows = [], size = APP.CELL_LIMIT;
    for (var i = 0, n = 0; i < text.length; i += size, n++) rows.push([key, String(n), safeCell_(text.slice(i, i + size))]);
    var sh = Db.sheet('_Blobs');
    sh.getRange(sh.getLastRow() + 1, 1, rows.length, 3).setNumberFormat('@').setValues(rows);
    Db._touch('_Blobs');
    this._memo = null;
  },
  remove: function (key) {
    var m = this._load();
    if (!m[key]) return;
    var sh = Db.sheet('_Blobs'), last = sh.getLastRow();
    var keys = sh.getRange(2, 1, last - 1, 1).getValues();
    for (var r = keys.length - 1; r >= 0; r--) if (keys[r][0] === key) sh.deleteRow(r + 2);
    Db._touch('_Blobs');
    this._memo = null;
  }
};

/* ================== Settings (key-value JSON) ================== */
function getSetting_(key) {
  var row = Db.get('Settings', key);
  var def = DEFAULT_SETTINGS[key];
  if (!row || row.value === null || row.value === '') return def !== undefined ? JSON.parse(JSON.stringify(def)) : null;
  if (def && typeof def === 'object' && !Array.isArray(def) && typeof row.value === 'object') {
    var merged = JSON.parse(JSON.stringify(def));
    for (var k in row.value) merged[k] = row.value[k];
    return merged;
  }
  return row.value;
}

function setSetting_(key, value) {
  return Db.upsert('Settings', key, { value: value, updatedAt: nowIso_() });
}

/* ================== Audit trail (append-only) ================== */
function audit_(ctx, action, resource, targetId, details) {
  try {
    Db.insert('Audit', {
      id: uid_('aud'), orgId: ctx && ctx.orgId || '', userId: ctx && ctx.userId || 'system',
      email: ctx && ctx.email || 'system', action: action, resource: resource || '', targetId: targetId || '',
      details: details || {}, createdAt: nowIso_()
    });
  } catch (e) { console.error('audit gagal', e); }
}

/**
 * 02_Auth.gs — Setup awal, login, sesi, RBAC & manajemen pengguna
 * Perbaikan dari versi React: tidak ada password hardcoded di klien, tidak ada "ganti persona"
 * tanpa login (celah eskalasi hak akses), sesi divalidasi di server.
 */

var HASH_ROUNDS = 250;

function hashPassword_(password, salt) {
  var h = salt + '|' + password;
  for (var i = 0; i < HASH_ROUNDS; i++) h = hmacHex_(h, salt + i);
  return h;
}

function newToken_() { return Utilities.getUuid().replace(/-/g, '') + Utilities.getUuid().replace(/-/g, ''); }

/** Jalankan SEKALI dari editor Apps Script (menu Run → setupApp). */
function setupApp(adminEmail, adminPassword) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  if (ss) prop_('SPREADSHEET_ID', ss.getId());
  Db.migrate = true;
  Object.keys(SCHEMA).forEach(function (n) { Db.sheet(n); });
  var def = Db.ss().getSheetByName('Sheet1') || Db.ss().getSheetByName('Lembar1');
  if (def && def.getLastRow() === 0 && Db.ss().getSheets().length > 1) Db.ss().deleteSheet(def);

  var email = String(adminEmail || Session.getEffectiveUser().getEmail() || 'admin@studio.local').toLowerCase();
  var pass = adminPassword || ('Cine-' + Utilities.getUuid().slice(0, 8));
  var created = false;
  if (!Db.all('Orgs').length) {
    Db.insert('Orgs', { id: 'org-main', name: 'Studio Utama', slug: 'utama', plan: 'TRIAL', dailyCapUsd: 5, episodeCapUsd: 1, killSwitch: false, createdAt: nowIso_() });
  }
  if (!Db.all('Users', function (u) { return u.role === 'ADMIN'; }).length) {
    var salt = Utilities.getUuid();
    Db.insert('Users', { id: uid_('usr'), orgId: 'org-main', email: email, name: 'Administrator', role: 'ADMIN',
      passHash: hashPassword_(pass, salt), salt: salt, active: true, createdAt: nowIso_(), failCount: 0 });
    created = true;
  }
  if (!prop_('TRIAL_STARTED')) prop_('TRIAL_STARTED', nowIso_());
  if (!prop_('API_SECRET')) prop_('API_SECRET', Utilities.getUuid());
  getMediaFolder_();
  if (!Db.all('Series').length) seedDemo_();
  Db.commit();
  var msg = created ? ('Setup selesai. Login admin: ' + email + ' / ' + pass + ' — SEGERA ganti password setelah login.') : 'Setup selesai (admin sudah ada).';
  console.log(msg);
  try { SpreadsheetApp.getUi().alert(APP.NAME, msg, SpreadsheetApp.getUi().ButtonSet.OK); } catch (e) { /* dari editor */ }
  return msg;
}

/** Menu di Google Sheet */
function onOpen() {

}

function menuResetAdmin_() {
  var ui = SpreadsheetApp.getUi();
  var r = ui.prompt('Reset password admin', 'Email admin:', ui.ButtonSet.OK_CANCEL);
  if (r.getSelectedButton() !== ui.Button.OK) return;
  var u = Db.all('Users', function (x) { return x.email === r.getResponseText().trim().toLowerCase(); })[0];
  if (!u) return ui.alert('Email tidak ditemukan');
  var pass = 'Cine-' + Utilities.getUuid().slice(0, 8), salt = Utilities.getUuid();
  Db.update('Users', u.id, { passHash: hashPassword_(pass, salt), salt: salt, failCount: 0, lockedUntil: '', active: true });
  Db.commit();
  ui.alert('Password baru: ' + pass);
}

function menuShowUrl_() {
  var url = ScriptApp.getService().getUrl();
  SpreadsheetApp.getUi().alert(url ? 'URL Web App:\n' + url : 'Belum di-deploy. Deploy → New deployment → Web app.');
}

function menuRunTests_() {
  var r = runSystemTests_();
  SpreadsheetApp.getUi().alert('Uji sistem: ' + r.passed + '/' + r.total + ' lulus\n\n' + r.items.map(function (i) { return (i.ok ? '✅ ' : '❌ ') + i.name + (i.ok ? '' : ' — ' + i.msg); }).join('\n'));
}

/* ============================== LOGIN ============================== */

function authLogin_(data) {
  var email = String(data.email || '').trim().toLowerCase();
  var pass = String(data.password || '');
  assert_(email && pass, 'BAD_INPUT', 'Email dan password wajib diisi.');
  var u = Db.all('Users', function (x) { return x.email === email; })[0];
  assert_(u, 'AUTH_FAILED', 'Email atau password salah.');
  assert_(u.active, 'AUTH_DISABLED', 'Akun dinonaktifkan. Hubungi admin.');
  if (u.lockedUntil && new Date(u.lockedUntil) > new Date()) {
    assert_(false, 'AUTH_LOCKED', 'Terlalu banyak percobaan. Coba lagi setelah ' + Utilities.formatDate(new Date(u.lockedUntil), 'Asia/Jakarta', 'HH:mm') + ' WIB.');
  }
  if (hashPassword_(pass, u.salt) !== u.passHash) {
    var fails = toNum_(u.failCount) + 1;
    Db.update('Users', u.id, { failCount: fails, lockedUntil: fails >= 5 ? new Date(Date.now() + 15 * 60000).toISOString() : '' });
    assert_(false, 'AUTH_FAILED', 'Email atau password salah.' + (fails >= 3 ? ' (' + (5 - Math.min(fails, 5)) + ' percobaan tersisa)' : ''));
  }
  Db.update('Users', u.id, { failCount: 0, lockedUntil: '', lastLogin: nowIso_() });
  var token = newToken_();
  Db.insert('Sessions', { token: sha256Hex_(token), userId: u.id, expiresAt: new Date(Date.now() + APP.SESSION_HOURS * 3600000).toISOString(), createdAt: nowIso_(), userAgent: clean_(data.ua, 200) });
  CacheService.getScriptCache().put('ses_' + sha256Hex_(token), u.id, 21600);
  audit_({ orgId: u.orgId, userId: u.id, email: u.email }, 'AUTH_LOGIN', 'user', u.id, {});
  // Kirim data boot sekaligus → klien tidak perlu panggilan app.boot kedua
  var ctx = { userId: u.id, orgId: u.orgId, role: u.role, email: u.email, name: u.name };
  var dash = null;
  try { dash = u.role === 'VIEWER' ? null : dashboardGet_(ctx); } catch (e) { dash = null; }
  return { token: token, user: publicUser_(u), boot: appBoot_(ctx), dash: dash };
}

function authRegister_(data) {
  assert_(getSetting_('publicRegistration') !== false, 'REG_CLOSED', 'Pendaftaran publik ditutup.');
  var email = String(data.email || '').trim().toLowerCase();
  assert_(/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email), 'BAD_EMAIL', 'Format email tidak valid.');
  assert_(String(data.password || '').length >= 8, 'WEAK_PASS', 'Password minimal 8 karakter.');
  assert_(data.agree === true, 'NEED_CONSENT', 'Centang persetujuan Syarat & Ketentuan dan Pemberitahuan Privasi untuk mendaftar.');
  assert_(!Db.all('Users', function (x) { return x.email === email; }).length, 'EMAIL_EXISTS', 'Email sudah terdaftar.');
  var salt = Utilities.getUuid();
  var org = Db.all('Orgs')[0];
  Db.insert('Users', { id: uid_('usr'), orgId: org ? org.id : 'org-main', email: email, name: clean_(data.name, 80) || email.split('@')[0],
    role: 'VIEWER', passHash: hashPassword_(data.password, salt), salt: salt, active: true, phone: clean_(data.phone, 20), createdAt: nowIso_(), failCount: 0,
    consentAt: nowIso_(), consentVer: APP.LEGAL_VERSION });
  return authLogin_({ email: email, password: data.password, ua: data.ua });
}

function authLogout_(ctx, token) {
  if (token) {
    var h = sha256Hex_(token);
    Db.remove('Sessions', h);
    CacheService.getScriptCache().remove('ses_' + h);
  }
  return { ok: true };
}

/** Resolve konteks pengguna dari token. Kembalikan GUEST bila tidak ada token. */
function resolveCtx_(token) {
  if (!token) return { role: 'GUEST', userId: '', orgId: '' };
  var h = sha256Hex_(token), cache = CacheService.getScriptCache();
  var userId = cache.get('ses_' + h);
  if (!userId) {
    var s = Db.get('Sessions', h);
    assert_(s && new Date(s.expiresAt) > new Date(), 'AUTH_EXPIRED', 'Sesi berakhir. Silakan login kembali.');
    userId = s.userId;
    cache.put('ses_' + h, userId, 21600);
  }
  var u = Db.get('Users', userId);
  assert_(u && u.active, 'AUTH_EXPIRED', 'Sesi tidak valid. Silakan login kembali.');
  return { userId: u.id, orgId: u.orgId, role: u.role, email: u.email, name: u.name, token: h };
}

function requireRole_(ctx, roles) {
  assert_(ctx && ctx.userId, 'AUTH_REQUIRED', 'Silakan login terlebih dahulu.');
  if (roles && roles.length) assert_(roles.indexOf(ctx.role) >= 0, 'ROLE_FORBIDDEN', 'Peran ' + ctx.role + ' tidak diizinkan untuk aksi ini.');
}

function publicUser_(u) {
  var org = Db.get('Orgs', u.orgId) || {};
  return { id: u.id, email: u.email, name: u.name, role: u.role, orgId: u.orgId, orgName: org.name || '', phone: u.phone || '', avatarUrl: u.avatarUrl || '', lastLogin: u.lastLogin || '' };
}

/** Bersihkan sesi kedaluwarsa & log idempotensi > 30 hari (dipanggil trigger harian) */
function cleanupSessions() {
  var now = new Date(), cut = Date.now() - 30 * 86400000;
  var n = Db.removeWhere('Sessions', function (s) { return new Date(s.expiresAt) < now; });
  n += Db.removeWhere('OpLog', function (o) { return new Date(o.createdAt).getTime() < cut; });
  Db.commit();
  return n;
}

/** Pasang trigger harian pembersihan (jalankan sekali dari editor) */
function installTriggers() {
  ScriptApp.getProjectTriggers().forEach(function (t) { if (t.getHandlerFunction() === 'cleanupSessions') ScriptApp.deleteTrigger(t); });
  ScriptApp.newTrigger('cleanupSessions').timeBased().everyDays(1).atHour(2).create();
  return 'Trigger harian terpasang (02:00).';
}

function usersSave_(ctx, d) {

  assert_(/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email), 'BAD_EMAIL', 'Email tidak valid.');
  if (d.id) {
    var cur = Db.get('Users', d.id);
    assert_(cur && (cur.orgId === ctx.orgId || cur.role === 'VIEWER'), 'NOT_FOUND', 'Pengguna tidak ditemukan.');
    if (cur.id === ctx.userId) assert_(d.role === 'ADMIN' && d.active !== false, 'SELF_LOCK', 'Tidak bisa menurunkan/menonaktifkan akun sendiri.');
    var patch = { name: clean_(d.name, 80), role: d.role, phone: clean_(d.phone, 20), active: d.active !== false };
    if (d.role !== 'VIEWER') patch.orgId = ctx.orgId;

  assert_(!Db.all('Users', function (x) { return x.email === email; }).length, 'EMAIL_EXISTS', 'Email sudah terdaftar.');
  if (d.role !== 'VIEWER') License.checkLimit('users', Db.all('Users', function (u) { return u.role !== 'VIEWER'; }).length);

  var u = Db.insert('Users', { id: uid_('usr'), orgId: ctx.orgId, email: email, name: clean_(d.name, 80), role: d.role, passHash: hashPassword_(d.password, salt),
    salt: salt, active: true, phone: clean_(d.phone, 20), createdAt: nowIso_(), failCount: 0 });
  audit_(ctx, 'USER_CREATE', 'user', u.id, { role: d.role, email: email });
  return publicUser_(u);
}

function profileSave_(ctx, d) {
  requireRole_(ctx);
  var u = Db.get('Users', ctx.userId), patch = { name: clean_(d.name, 80) || u.name, phone: clean_(d.phone, 20) };

}

/**
 * 03_Api.gs — Router API tunggal.
 * - Dari HtmlService: google.script.run.api({action, data, token, opId})
 * - Dari PWA GitHub Pages: fetch(URL_EXEC, {method:'POST', body: JSON.stringify({...})}) Content-Type text/plain
 */

function doGet(e) {
  var p = (e && e.parameter) || {};
  if (p.action === 'ping') return json_({ ok: true, app: APP.NAME, version: APP.VERSION, time: nowIso_() });
  if (p.action) {
    var r = routes_()[p.action];
    if (!r || r[2]) return json_({ ok: false, error: { code: 'USE_POST', message: 'Aksi tulis wajib lewat POST.' } });
    return json_(handle_({ action: p.action, data: p.data ? safeParse_(p.data) : {}, token: p.token || '' }));
  }
  var t = HtmlService.createTemplateFromFile('Index');
  t.boot = JSON.stringify({ mode: 'gas', version: APP.VERSION });
  return t.evaluate()
    .setTitle(APP.NAME)
    .addMetaTag('viewport', 'width=device-width, initial-scale=1, viewport-fit=cover')
    .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL);
}

function doPost(e) {
  var body = {};
  try { body = JSON.parse((e && e.postData && e.postData.contents) || '{}'); } catch (err) { return json_({ ok: false, error: { code: 'BAD_JSON', message: 'Body bukan JSON.' } }); }
  return json_(handle_(body));
}

/** Dipanggil dari google.script.run */
function api(req) { return handle_(req || {}); }

function json_(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }
function safeParse_(s) { try { return JSON.parse(s); } catch (e) { return {}; } }

/** Tabel rute: action → [fungsi, butuhLogin, tulis(idempotent)]
 * Dibuat lazy (fungsi) karena di GAS file dievaluasi berurutan: referensi ke fungsi di file lain
 * pada variabel global tingkat atas bisa ReferenceError. */
var ROUTES_ = null;
function routes_() {
  if (ROUTES_) return ROUTES_;
  ROUTES_ = {
  // Publik
  'auth.login': [function (c, d) { return authLogin_(d); }, false, false],
  'auth.register': [function (c, d) { return authRegister_(d); }, false, false],
  'app.boot': [appBoot_, false, false],
  'catalog.list': [catalogList_, false, false],
  'viewer.playback': [viewerPlayback_, false, false],
  // Sesi
  'auth.logout': [function (c, d, r) { return authLogout_(c, r.token); }, true, false],
  'auth.me': [function (c) { return publicUser_(Db.get('Users', c.userId)); }, true, false],
  'profile.save': [profileSave_, true, true],
  'account.export': [accountExport_, true, false],
  'account.delete': [accountDelete_, true, true],
  'dashboard.get': [dashboardGet_, true, false],
  // Studio
  'series.list': [seriesList_, true, false],
  'series.save': [seriesSave_, true, true],
  'series.delete': [seriesDelete_, true, true],
  'episodes.list': [episodesList_, true, false],
  'episode.save': [episodeSave_, true, true],
  'episode.status': [episodeStatus_, true, true],
  'episode.delete': [episodeDelete_, true, true],
  'episode.workspace': [episodeWorkspace_, true, false],
  'characters.list': [charactersList_, true, false],
  'character.save': [characterSave_, true, true],
  'character.delete': [characterDelete_, true, true],
  // Naskah
  'script.get': [scriptGet_, true, false],
  'script.save': [scriptSave_, true, true],
  'script.approve': [scriptApprove_, true, true],
  'script.diff': [scriptDiff_, true, false],
  'script.aiGenerate': [scriptAiGenerate_, true, true],
  'script.aiDoctor': [scriptAiDoctor_, true, false],
  // Produksi
  'storyboard.list': [storyboardList_, true, false],
  'storyboard.generate': [storyboardGenerate_, true, true],
  'storyboard.update': [storyboardUpdate_, true, true],
  'assembly.get': [assemblyGet_, true, false],
  'assembly.save': [assemblySave_, true, true],
  'qc.get': [qcGet_, true, false],
  'qc.scan': [qcScan_, true, true],
  'qc.signoff': [qcSignOff_, true, true],
  'comments.list': [commentsList_, true, false],
  'comment.add': [commentAdd_, true, true],
  'comment.resolve': [commentResolve_, true, true],
  'bundle.export': [bundleExport_, true, false],
  // Penonton & monetisasi
  'viewer.engage': [viewerEngage_, false, true],
  'wallet.get': [walletGet_, true, false],
  'wallet.unlock': [walletUnlock_, true, true],
  'topup.request': [topupRequest_, true, true],
  'topup.list': [topupList_, true, false],
  'topup.review': [topupReview_, true, true],
  'paywall.get': [paywallGet_, true, false],
  'paywall.save': [paywallSave_, true, true],
  'royalty.get': [royaltyGet_, true, false],
  // Pertumbuhan
  'dub.list': [dubList_, true, false],
  'dub.translate': [dubTranslate_, true, true],
  'syndication.list': [syndicationList_, true, false],
  'syndication.create': [syndicationCreate_, true, true],
  'hooks.list': [hooksList_, true, false],
  'hooks.generate': [hooksGenerate_, true, true],
  'hooks.save': [hooksSave_, true, true],
  'retention.get': [retentionGet_, true, false],
  // Admin
  'budget.get': [budgetGet_, true, false],
  'budget.save': [budgetSave_, true, true],
  'ai.testKey': [aiTestKey_, true, false],
  'audit.list': [auditList_, true, false],
  'users.list': [usersList_, true, false],
  'users.save': [usersSave_, true, true],
  'settings.get': [settingsGet_, true, false],
  'settings.save': [settingsSave_, true, true],
  'license.status': [function (c) { requireRole_(c, ['ADMIN']); return License.status(); }, true, false],

  'media.upload': [mediaUpload_, true, true],
  'backup.export': [backupExport_, true, false],
  'tests.run': [function (c) { requireRole_(c, ['ADMIN']); return runSystemTests_(); }, true, false],
  'notify.test': [notifyTest_, true, false]
  };
  return ROUTES_;
}

function handle_(req) {
  var t0 = Date.now();
  Db.reset();
  try {
    var route = routes_()[req.action];
    assert_(route, 'UNKNOWN_ACTION', 'Aksi tidak dikenal: ' + req.action);
    var ctx = resolveCtx_(req.token);
    if (route[1]) requireRole_(ctx);
    rateLimit_(ctx.userId || ('ip-' + (req.data && req.data.deviceId || 'anon')));
    var data = req.data || {};
    var result;
    if (route[2]) {
      // Aksi tulis: idempoten via opId (antrian offline bisa mengirim ulang)
      result = Db.withLock(function () {
        // Idempotensi via CacheService (6 jam) — tanpa membaca sheet, jauh lebih cepat
        var cache = CacheService.getScriptCache(), opKey = req.opId ? 'op_' + String(req.opId).slice(0, 64) : '';
        if (opKey && cache.get(opKey)) return { duplicate: true, opId: req.opId };
        try {
          var r = route[0](ctx, data, req);
          if (opKey) cache.put(opKey, '1', 21600);
          return r;
        } finally { Db.commit(); }
      });
    } else {
      result = route[0](ctx, data, req);
    }
    Db.commit();
    return { ok: true, data: result, ms: Date.now() - t0 };
  } catch (e) {
    try { Db.commit(); } catch (x) { }
    console.error(req.action, e && e.stack || e);
    return { ok: false, error: { code: e.code || 'SERVER_ERROR', message: e.message || String(e) }, ms: Date.now() - t0 };
  }
}

function rateLimit_(key) {
  var c = CacheService.getScriptCache(), k = 'rl_' + key + '_' + Math.floor(Date.now() / 60000);
  var n = toNum_(c.get(k), 0) + 1;
  c.put(k, String(n), 70);
  assert_(n <= 120, 'RATE_LIMIT', 'Terlalu banyak permintaan. Tunggu sebentar.');
}

    features: lic.features, statusLabel: STATUS_LABEL, flow: EPISODE_FLOW,
    coinPackages: getSetting_('coinPackages'), payment: getSetting_('payment'), pendingTopups: pending, legal: getSetting_('legal'), legalVersion: APP.LEGAL_VERSION, build: APP.BUILD
  };
}

/**
 * 04_Studio.gs — Serial, episode, karakter (bible), mesin status, dashboard
 */

var GENRES = ['ROMANCE_CEO', 'REVENGE', 'HIDDEN_IDENTITY', 'FAMILY_SECRET', 'THRILLER', 'COMEDY', 'HOROR', 'RELIGI', 'FANTASY', 'LAINNYA'];
var ARCHETYPES = ['PROTAGONIST', 'ANTAGONIST', 'LOVE_INTEREST', 'SUPPORTING', 'CONFIDANT'];
var CONSENT_TYPES = ['SYNTHETIC', 'CONSENTED_ACTOR', 'LICENSED_STOCK'];

function ownSeries_(ctx, id) {
  var s = Db.get('Series', id);
  assert_(s && s.orgId === ctx.orgId, 'NOT_FOUND', 'Serial tidak ditemukan di organisasi Anda.');
  return s;
}
function ownEpisode_(ctx, id) {
  var e = Db.get('Episodes', id);
  assert_(e && e.orgId === ctx.orgId, 'NOT_FOUND', 'Episode tidak ditemukan di organisasi Anda.');
  return e;
}
function studioOnly_(ctx) { requireRole_(ctx, ['ADMIN', 'CREATOR', 'REVIEWER']); }

/* ================================ SERIAL ================================ */
function seriesList_(ctx) {
  studioOnly_(ctx);
  var eps = Db.all('Episodes', function (e) { return e.orgId === ctx.orgId; });
  return Db.all('Series', function (s) { return s.orgId === ctx.orgId; }).map(function (s) {
    var mine = eps.filter(function (e) { return e.seriesId === s.id; });
    s.episodeCount = mine.length;
    s.publishedCount = mine.filter(function (e) { return e.status === 'PUBLISHED'; }).length;
    return s;
  }).sort(function (a, b) { return String(b.updatedAt).localeCompare(String(a.updatedAt)); });
}

function seriesSave_(ctx, d) {
  requireRole_(ctx, ['ADMIN', 'CREATOR']);
  var title = clean_(d.title, 120);
  assert_(title.length >= 3, 'BAD_INPUT', 'Judul serial minimal 3 karakter.');
  var rec = {
    title: title, genre: GENRES.indexOf(d.genre) >= 0 ? d.genre : 'LAINNYA', logline: clean_(d.logline, 400), synopsis: clean_(d.synopsis, 20000),
    plannedEps: Math.max(1, Math.min(500, toNum_(d.plannedEps, 30))), targetSec: Math.max(30, Math.min(600, toNum_(d.targetSec, 90))),
    aspect: '9:16', coverUrl: clean_(d.coverUrl, 500), tags: clean_(d.tags, 200), language: clean_(d.language, 5) || 'id', updatedAt: nowIso_()
  };
  if (d.id) {
    ownSeries_(ctx, d.id);
    var s = Db.update('Series', d.id, rec);
    audit_(ctx, 'SERIES_UPDATE', 'series', d.id, { title: title });
    return s;
  }
  License.checkLimit('series', Db.all('Series').length);
  rec.id = uid_('ser'); rec.orgId = ctx.orgId; rec.status = 'ACTIVE'; rec.createdBy = ctx.userId; rec.createdAt = nowIso_();
  var cfg = getSetting_('defaults');
  Db.insert('Series', rec);
  Db.insert('Paywall', { id: rec.id, orgId: ctx.orgId, freeCount: cfg.freeCount, coinsPerEp: cfg.coinsPerEp, seasonPrice: cfg.seasonPrice, enabled: true, updatedAt: nowIso_() });
  audit_(ctx, 'SERIES_CREATE', 'series', rec.id, { title: title });
  return rec;
}

function seriesDelete_(ctx, d) {
  requireRole_(ctx, ['ADMIN']);
  var s = ownSeries_(ctx, d.id);
  var eps = Db.all('Episodes', function (e) { return e.seriesId === s.id; });
  assert_(!eps.some(function (e) { return e.status === 'PUBLISHED'; }), 'HAS_PUBLISHED', 'Arsipkan dulu episode yang sudah tayang sebelum menghapus serial.');
  eps.forEach(function (e) { deleteEpisodeCascade_(e.id); });
  Db.removeWhere('Characters', function (c) { return c.seriesId === s.id; });
  Db.remove('Paywall', s.id);
  Db.remove('Series', s.id);
  audit_(ctx, 'SERIES_DELETE', 'series', s.id, { title: s.title, episodes: eps.length });
  return { ok: true };
}

/* ================================ EPISODE ================================ */
function episodesList_(ctx, d) {
  studioOnly_(ctx);
  if (d.seriesId) ownSeries_(ctx, d.seriesId);
  return Db.all('Episodes', function (e) { return e.orgId === ctx.orgId && (!d.seriesId || e.seriesId === d.seriesId); })
    .sort(function (a, b) { return a.number - b.number; });
}

function episodeSave_(ctx, d) {
  requireRole_(ctx, ['ADMIN', 'CREATOR']);
  var s = ownSeries_(ctx, d.seriesId);
  var rec = {
    title: clean_(d.title, 160), hook: clean_(d.hook, 600), durationSec: Math.max(0, Math.min(1800, toNum_(d.durationSec, s.targetSec))),
    videoUrl: normalizeMediaUrl_(clean_(d.videoUrl, 500)), thumbUrl: clean_(d.thumbUrl, 500), isFree: toBool_(d.isFree), updatedAt: nowIso_()
  };
  assert_(rec.title.length >= 2, 'BAD_INPUT', 'Judul episode wajib diisi.');
  if (d.id) {
    var cur = ownEpisode_(ctx, d.id);
    assert_(cur.seriesId === s.id, 'BAD_INPUT', 'Episode bukan milik serial ini.');
    if (d.number && toNum_(d.number) !== cur.number) {
      assert_(!Db.all('Episodes', function (e) { return e.seriesId === s.id && e.number === toNum_(d.number) && e.id !== cur.id; }).length, 'DUP_NUMBER', 'Nomor episode sudah dipakai.');
      rec.number = toNum_(d.number);
    }
    var up = Db.update('Episodes', d.id, rec);
    audit_(ctx, 'EPISODE_UPDATE', 'episode', d.id, { title: rec.title });
    return up;
  }
  License.checkLimit('episodes', Db.all('Episodes').length);
  var existing = Db.all('Episodes', function (e) { return e.seriesId === s.id; });
  var num = toNum_(d.number, 0) || (existing.reduce(function (m, e) { return Math.max(m, e.number); }, 0) + 1);
  assert_(!existing.some(function (e) { return e.number === num; }), 'DUP_NUMBER', 'Nomor episode ' + num + ' sudah ada.');
  rec.id = uid_('ep'); rec.orgId = ctx.orgId; rec.seriesId = s.id; rec.number = num; rec.status = 'DRAFT';
  rec.createdBy = ctx.userId; rec.createdAt = nowIso_();
  Db.insert('Episodes', rec);
  Db.update('Series', s.id, { updatedAt: nowIso_() });
  audit_(ctx, 'EPISODE_CREATE', 'episode', rec.id, { number: num, title: rec.title });
  return rec;
}

function deleteEpisodeCascade_(epId) {
  ['Scripts', 'Frames', 'Comments', 'Dubs', 'Syndication', 'Hooks'].forEach(function (t) {
    Db.removeWhere(t, function (r) { return r.episodeId === epId; });
  });
  Db.remove('Assembly', epId); Db.remove('QC', epId); Db.remove('Episodes', epId);
}

function episodeDelete_(ctx, d) {
  requireRole_(ctx, ['ADMIN']);
  var e = ownEpisode_(ctx, d.id);
  assert_(e.status !== 'PUBLISHED', 'IS_PUBLISHED', 'Episode tayang harus diarsipkan dulu.');
  deleteEpisodeCascade_(e.id);
  audit_(ctx, 'EPISODE_DELETE', 'episode', e.id, { title: e.title });
  return { ok: true };
}

/** Validasi transisi status + prasyarat (gerbang mutu) */
function checkTransition_(ctx, ep, to) {
  var allowed = (EPISODE_FLOW[ep.status] || {})[to];
  assert_(allowed, 'BAD_TRANSITION', 'Transisi ' + ep.status + ' → ' + to + ' tidak diperbolehkan.');
  assert_(allowed.indexOf(ctx.role) >= 0, 'ROLE_FORBIDDEN', 'Peran ' + ctx.role + ' tidak boleh memindahkan ke ' + (STATUS_LABEL[to] || to) + '.');
  var issues = [];
  if (to === 'SCRIPT_REVIEW') {
    var sc = latestScript_(ep.id);
    if (!sc) issues.push('Naskah belum dibuat.');
    else if (sc.validation === 'INVALID') issues.push('Naskah masih INVALID: ' + (sc.issues || []).join('; '));
  }
  if (to === 'STORYBOARD_READY' && ep.status === 'SCRIPT_REVIEW') {
    var s2 = latestScript_(ep.id);
    if (!s2 || !s2.approved) issues.push('Naskah versi terbaru belum disetujui reviewer.');
  }
  if (to === 'RENDERING' && ep.status === 'STORYBOARD_READY') {
    var fr = Db.all('Frames', function (f) { return f.episodeId === ep.id; });
    if (!fr.length) issues.push('Storyboard belum dibuat.');
    var notOk = fr.filter(function (f) { return f.status !== 'APPROVED'; }).length;
    if (notOk) issues.push(notOk + ' frame storyboard belum disetujui.');
  }
  if (to === 'QC_PENDING' && ep.status === 'RENDERING' && !ep.videoUrl) issues.push('URL video master belum diisi (menu Edit Episode).');
  if (to === 'PUBLISHED') {
    var q = Db.get('QC', ep.id);
    if (!q || !q.signOff || q.signOff.decision !== 'APPROVED_FOR_RELEASE') issues.push('Belum ada sign-off QC "Disetujui tayang".');
    if (!ep.videoUrl) issues.push('URL video belum diisi.');
  }
  return issues;
}

function episodeStatus_(ctx, d) {
  studioOnly_(ctx);
  var ep = ownEpisode_(ctx, d.id), to = String(d.status || '');
  assert_(STATUS_LABEL[to], 'BAD_STATUS', 'Status tidak dikenal.');

    requireRole_(ctx, ['ADMIN']);
    assert_(clean_(d.reason).length >= 5, 'NEED_REASON', 'Override admin wajib menyertakan alasan (min 5 karakter).');
  } else {
    issues = checkTransition_(ctx, ep, to);

  }
  var patch = { status: to, updatedAt: nowIso_() };

  var up = Db.update('Episodes', ep.id, patch);

  return up;
}
